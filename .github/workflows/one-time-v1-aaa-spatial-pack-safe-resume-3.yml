name: One-Time V1 Receptionist Missing-Only Recovery

on:
  push:
    branches: [main]
    paths:
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-v1-receptionist-recovery-20260729
  cancel-in-progress: false

jobs:
  authorize:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.validate.outputs.target_sha }}
      provider: ${{ steps.validate.outputs.provider }}
      endpoint: ${{ steps.validate.outputs.endpoint }}
      alpha_model: ${{ steps.validate.outputs.alpha_model }}
      target_asset: ${{ steps.validate.outputs.target_asset }}
      retained_artifact_id: ${{ steps.validate.outputs.retained_artifact_id }}
    steps:
      - name: Checkout exact authorization commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable one-file authorization
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          marker=authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/validate_v1_receptionist_recovery_commit.py \
            --commit "$GITHUB_SHA" \
            --marker "$marker" \
            --github-output "$GITHUB_OUTPUT"
          echo "target_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  retained-preflight:
    needs: authorize
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      safe_to_execute: ${{ steps.prove.outputs.safe_to_execute }}
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect retained artifact identity and exact 52/1 state
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_ARTIFACT_ID: ${{ needs.authorize.outputs.retained_artifact_id }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETAINED_ARTIFACT_ID}" > "$metadata"
          python - "$metadata" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          assert payload['id'] == 8741010314, payload
          assert payload['expired'] is False, payload
          assert payload.get('digest') == 'sha256:10318639cd60051d612a4277a639a2bd9fd55d64fda3e17b1a7d42452d9e24ff', payload
          print('RETAINED_ARTIFACT_IDENTITY_OK')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETAINED_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/retained.zip"
          mkdir -p "$RUNNER_TEMP/retained"
          unzip -q "$RUNNER_TEMP/retained.zip" -d "$RUNNER_TEMP/retained"
          python -m pip install -r image_asset_generator/requirements.txt
          root="$RUNNER_TEMP/retained/image_asset_generator"
          test -f "$root/manifests/generated/v1.manifest.json"
          cp image_asset_generator/score_v1_assets.py "$root/score_v1_assets.py"
          cp "$root/manifests/generated/v1.manifest.json" "$root/manifest.json"
          (cd "$root" && python - <<'PY'
          import json
          import score_v1_assets as scorer
          entries=json.load(open('manifest.json'))
          records=[scorer.score(entry, True) for entry in entries]
          failed=[record['name'] for record in records if record['status'] != 'passed']
          assert len(entries) == 53
          assert len(records)-len(failed) == 52
          assert failed == ['avatar_receptionist'], failed
          print('RETAINED_PACK_PROVEN passed=52 failed=1')
          PY
          )
          mkdir -p artifacts/preflight
          cp "$metadata" artifacts/preflight/retained-artifact-metadata.json
          printf '%s\n' '{"safeToExecute":true,"retainedArtifactId":8741010314,"accepted":52,"retry":"avatar_receptionist","providerCalls":0,"spendUsd":"0.00"}' > artifacts/preflight/v1-receptionist-recovery-preflight.json
          echo 'safe_to_execute=true' >> "$GITHUB_OUTPUT"
      - name: Upload no-spend retained-pack proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-receptionist-recovery-preflight-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/preflight/*.json

  execute:
    needs: [authorize, retained-preflight]
    if: needs.retained-preflight.outputs.safe_to_execute == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: paid-asset-generation
    permissions:
      actions: read
      contents: read
    env:
      ASSET_RENDERER_PROVIDER: ${{ needs.authorize.outputs.provider }}
      ASSET_RENDERER_ENDPOINT: ${{ needs.authorize.outputs.endpoint }}
      ASSET_RENDERER_MODEL: ${{ needs.authorize.outputs.alpha_model }}
      ASSET_RENDERER_ALPHA_MODEL: ${{ needs.authorize.outputs.alpha_model }}
      ASSET_RENDERER_MODE: provider
      ASSET_RENDERER_MAX_ATTEMPTS: '1'
      ASSET_FORGE_REQUIRE_PROVIDER: '1'
      ASSET_QUALITY_REQUIRE_PROVIDER: '1'
      ASSET_FORGE_PAID_RUN_AUTHORIZED: '1'
      ASSET_FORGE_MAX_PROVIDER_CALLS: '1'
      ASSET_FORGE_MAX_UNIT_COST_USD: '1.00'
      ASSET_FORGE_MAX_COST_USD: '1.00'
      ASSET_FORGE_RUN_ID: ${{ github.run_id }}-v1-receptionist-recovery
      ASSET_FORGE_BUDGET_STATE_PATH: ${{ github.workspace }}/artifacts/budget/v1-receptionist-paid-request-state.json
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact identity and hard one-call boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.authorize.outputs.target_sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test '${{ needs.authorize.outputs.target_asset }}' = 'avatar_receptionist'
          test "$ASSET_RENDERER_PROVIDER" = 'openai'
          test "$ASSET_RENDERER_ENDPOINT" = 'https://api.openai.com/v1/images/generations'
          test "$ASSET_RENDERER_ALPHA_MODEL" = 'gpt-image-1.5'
          test "$ASSET_FORGE_MAX_PROVIDER_CALLS" = '1'
          test "$ASSET_FORGE_MAX_UNIT_COST_USD" = '1.00'
          test "$ASSET_FORGE_MAX_COST_USD" = '1.00'
          test -z "${URAI_WHEEL_GITHUB_TOKEN:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"
      - name: Download exact retained pack
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_ARTIFACT_ID: ${{ needs.authorize.outputs.retained_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETAINED_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/retained.zip"
          mkdir -p "$RUNNER_TEMP/retained"
          unzip -q "$RUNNER_TEMP/retained.zip" -d "$RUNNER_TEMP/retained"
          echo "V1_RETAINED_ARTIFACT_DIR=$RUNNER_TEMP/retained/image_asset_generator" >> "$GITHUB_ENV"
      - name: Install image dependencies
        run: python -m pip install -r image_asset_generator/requirements.txt
      - name: Run one-asset provider recovery and full certification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python image_asset_generator/recover_v1_receptionist.py
      - name: Upload complete recovery and certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-v1-receptionist-recovery-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            artifacts/budget/*.json
            image_asset_generator/manifests/generated/v1.manifest.json
            image_asset_generator/quality_report.json
            image_asset_generator/upgrade_feedback.json
            image_asset_generator/forge_receipt_v1_receptionist_recovery.json
            image_asset_generator/provenance_v1_receptionist_recovery.json
            image_asset_generator/contact_sheet_v1_receptionist_recovery.png
            image_asset_generator/dropin_receipt*.json
            image_asset_generator/assets/**
            image_asset_generator/preview.html
            image_asset_generator/asset_pack.zip
            image_asset_generator/spatial_handoff/**
