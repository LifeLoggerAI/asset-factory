name: Activate V2 Certified Failed-Only Repair

on:
  push:
    branches: [repair/v2-certified-gaps-20260730]
    paths:
      - authorizations/activate-v2-certified-repair-20260730.json

permissions:
  actions: read
  contents: read

concurrency:
  group: activate-v2-certified-repair-20260730
  cancel-in-progress: false

jobs:
  authorize:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      safe: ${{ steps.validate.outputs.safe }}
    steps:
      - name: Checkout exact activation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: validate
        name: Validate one-use activation and failed-only authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path

          auth_path = Path('authorizations/execute-v2-certified-repair-20260730.json')
          activation_path = Path('authorizations/activate-v2-certified-repair-20260730.json')
          encoded_path = Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64')
          manifest_path = Path('manifests/v2-certified-repair-manifest-20260730.json')

          manifest_path.write_bytes(gzip.decompress(base64.b64decode(encoded_path.read_text().strip())))
          auth = json.loads(auth_path.read_text())
          activation = json.loads(activation_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          execution = auth['execution']

          assert auth['programAuthority'] == 'LifeLoggerAI/asset-factory#206'
          assert activation['programAuthority'] == auth['programAuthority']
          assert activation['executionNonce'] == 'v2-71-certified-repair-20260730-r1'
          assert activation['requested'] is True
          assert activation['promotionAuthorized'] is False
          assert activation['deploymentAuthorized'] is False
          assert activation['maxProviderCalls'] == 142
          assert activation['maxSpendUsd'] == '20.00'
          assert execution['activationRequired'] is True
          assert execution['activationMarker'] == str(activation_path)
          assert execution['replacementAssets'] == 71
          assert execution['preservedAssets'] == 9
          assert execution['maxAttemptsPerAsset'] == 2
          assert execution['maxProviderCalls'] == 142
          assert execution['maxSpendUsd'] == '20.00'
          assert execution['promotionAuthorized'] is False
          assert execution['deploymentAuthorized'] is False
          assert len(manifest['replacements']) == 71
          assert len(manifest['preserve']) == 9
          assert all(item['model'] == 'gpt-image-2' for item in manifest['replacements'])
          assert all(item['quality'] == 'medium' for item in manifest['replacements'])

          out = Path('artifacts/v2-certified-repair')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'activation-receipt.json').write_text(json.dumps({
              'status': 'authorized',
              'programAuthority': auth['programAuthority'],
              'activationCommit': activation['activationCommitExpected'],
              'executionNonce': activation['executionNonce'],
              'replacementAssets': 71,
              'preservedAssets': 9,
              'maxProviderCalls': 142,
              'maxSpendUsd': '20.00',
              'promotionAuthorized': False,
              'deploymentAuthorized': False,
              'authorizationSha256': hashlib.sha256(auth_path.read_bytes()).hexdigest(),
              'activationSha256': hashlib.sha256(activation_path.read_bytes()).hexdigest(),
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
          }, indent=2, sort_keys=True) + '\n')
          print('V2_PAID_ACTIVATION_AUTHORIZED')
          PY
          echo 'safe=true' >> "$GITHUB_OUTPUT"

  generate:
    needs: authorize
    if: needs.authorize.outputs.safe == 'true'
    environment: paid-asset-generation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout exact activation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore exact certified repair manifest
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64').read_text().strip()
          Path('manifests/v2-certified-repair-manifest-20260730.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Verify protected provider boundary
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Install deterministic dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Generate and validate only 71 certified replacements
        run: python scripts/generate_v2_certified_replacements.py
      - name: Seal execution receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('artifacts/v2-certified-repair')
          out.mkdir(parents=True, exist_ok=True)
          receipt_path = out / 'generation-receipt.json'
          data = json.loads(receipt_path.read_text()) if receipt_path.exists() else {}
          data['authorizedSpendCeilingUsd'] = '20.00'
          data['authorizedProviderCallCeiling'] = 142
          data['promotionAuthorized'] = False
          data['deploymentAuthorized'] = False
          data['executionCommit'] = '${{ github.sha }}'
          receipt_path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload complete V2 paid evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-certified-failed-only-repair-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: artifacts/v2-certified-repair/**
