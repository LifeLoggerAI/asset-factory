# Exact remediation receipt: docs/security/factory-firebase-sdk-node-forge-remediation-20261007.md
name: Factory Firebase SDK lock refresh proof

on:
  pull_request:
    branches:
      - repair/model-forge-current-main-20261007
    paths:
      - package.json
      - functions/package.json
      - life-map-pipeline/functions/package.json
      - life-map-pipeline/functions/src/**
      - pnpm-lock.yaml
      - life-map-pipeline/functions/package-lock.json
      - .github/workflows/factory-firebase-sdk-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: factory-firebase-sdk-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact donor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_SOURCE_SHA }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate workspace and deployment locks without scripts
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm@9.15.9 install --lockfile-only --ignore-scripts
          npm --prefix life-map-pipeline/functions install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove node-forge leaves governed lock graphs
        shell: bash
        run: |
          set -euo pipefail
          if grep -n "node-forge" pnpm-lock.yaml life-map-pipeline/functions/package-lock.json; then
            echo "node-forge remains in a governed lock graph" >&2
            exit 1
          fi
      - name: Install regenerated frozen graphs
        run: |
          corepack pnpm@9.15.9 install --frozen-lockfile --ignore-scripts
          npm --prefix life-map-pipeline/functions ci --ignore-scripts --no-audit --no-fund
      - name: Build and test Firebase packages
        run: |
          npm --prefix life-map-pipeline/functions run build
          npm --prefix life-map-pipeline/functions test
          npm --prefix functions test
      - name: Prove only the separately unresolved braces HIGH remains
        shell: bash
        run: |
          set -euo pipefail
          git init .public-reviewed-advisories
          git -C .public-reviewed-advisories remote add origin https://github.com/github/advisory-database.git
          git -C .public-reviewed-advisories fetch --depth 1 origin 161aa622af11e0b687366ff64cf068f7cca59a50
          git -C .public-reviewed-advisories checkout --detach FETCH_HEAD
          set +e
          node scripts/check-installed-reviewed-advisories.mjs .public-reviewed-advisories artifacts/firebase-sdk-remediation-security.json
          status=$?
          set -e
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync('artifacts/firebase-sdk-remediation-security.json','utf8'));
          const expected=['GHSA-vfj7-8cjw-p6xm'];
          if (JSON.stringify(result.severeUniqueAdvisories)!==JSON.stringify(expected)) {
            throw new Error('Unexpected remaining high/critical advisories: '+JSON.stringify(result.severeUniqueAdvisories));
          }
          if (result.problems?.length) throw new Error('Installed dependency graph has unresolved package problems');
          if (result.findings?.some(f=>f.name==='node-forge' && ['high','critical'].includes(f.severity))) {
            throw new Error('node-forge HIGH/CRITICAL finding survived SDK remediation');
          }
          console.log(JSON.stringify({status:'EXPECTED_FAIL_CLOSED_BRACES_ONLY',installedNodes:result.installedNodes,severeUniqueAdvisories:result.severeUniqueAdvisories}));
          NODE
      - name: Commit proven generated lock candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml life-map-pipeline/functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated lock candidates already match committed bytes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): commit proven Firebase SDK lock candidates"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Retain generated lock candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-firebase-sdk-locks-${{ env.EXACT_SOURCE_SHA }}
          retention-days: 14
          path: |
            pnpm-lock.yaml
            life-map-pipeline/functions/package-lock.json
            artifacts/firebase-sdk-remediation-security.json
