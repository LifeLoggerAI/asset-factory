name: Launch asset preparation source
on:
  pull_request:
    paths:
      - 'model_forge/launch-asset-preparation/v1/**'
      - '.github/workflows/launch-asset-preparation-source.yml'
permissions:
  contents: read
jobs:
  source-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned public tooling without graph disclosure
        working-directory: model_forge/launch-asset-preparation/v1
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test deterministic encoding and failure boundaries
        working-directory: model_forge/launch-asset-preparation/v1
        run: npm test
