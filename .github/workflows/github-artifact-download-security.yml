name: GitHub Artifact Credential Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/github-artifact-download-security.yml
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - scripts/github_artifact_download.py
      - scripts/test-github-artifact-download.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py
  push:
    branches: [main]
    paths:
      - .github/workflows/github-artifact-download-security.yml
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - scripts/github_artifact_download.py
      - scripts/test-github-artifact-download.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove exact head and clean tree
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Compile and execute artifact extraction security regressions
        run: |
          python3 -m py_compile \
            scripts/github_artifact_download.py \
            scripts/test-github-artifact-download.py \
            scripts/validate_v1_receptionist_recovery_marker.py \
            scripts/validate_v1_receptionist_recovery_commit.py
          python3 scripts/test-github-artifact-download.py
      - name: Verify credential and permission isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          assert text.count('OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}') == 1
          assert 'environment: paid-asset-generation' in text
          assert 'permissions:\n      actions: read\n      contents: read' in text
          assert 'persist-credentials: false' in text
          assert 'retainedArtifactId' in text and '8741010314' in text
          assert 'retainedArtifactDigest' in Path('scripts/validate_v1_receptionist_recovery_marker.py').read_text()
          for forbidden in ('contents: write','actions: write','issues: write','pull-requests: write','deployments: write','id-token: write','git push','firebase deploy'):
              assert forbidden not in text, forbidden
          PY
      - name: Verify artifact metadata before archive download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          metadata=text.index('/actions/artifacts/${RETAINED_ARTIFACT_ID}" > "$metadata"')
          digest=text.index("payload.get('digest')")
          download=text.index('/actions/artifacts/${RETAINED_ARTIFACT_ID}/zip')
          assert metadata < digest < download
          assert "payload['expired'] is False" in text
          assert 'sha256:10318639cd60051d612a4277a639a2bd9fd55d64fda3e17b1a7d42452d9e24ff' in text
          PY
      - name: Verify secret is unavailable to retained preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          preflight=text.split('  retained-preflight:',1)[1].split('  execute:',1)[0]
          assert 'OPENAI_API_KEY' not in preflight
          assert 'paid-asset-generation' not in preflight
          execute=text.split('  execute:',1)[1]
          assert 'OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}' in execute
          assert 'environment: paid-asset-generation' in execute
          PY
