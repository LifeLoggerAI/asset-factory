name: Grant Runway Retention Secret Access

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-runway-retention-secret-access
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: urai-4dc1d
  GCP_WIF_PROVIDER: projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github
  GCP_DEPLOY_SERVICE_ACCOUNT: asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com

jobs:
  grant-access:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 326 &&
        github.event.comment.body == 'GRANT_RUNWAY_RETENTION_SECRET_ACCESS' &&
        github.event.comment.author_association == 'OWNER' &&
        github.actor == github.repository_owner
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout exact main authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact bounded authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/asset-factory'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          if [ "${{ github.event_name }}" = 'issue_comment' ]; then
            test "${{ github.event.issue.number }}" = '326'
            test "${{ github.event.comment.body }}" = 'GRANT_RUNWAY_RETENTION_SECRET_ACCESS'
            test "${{ github.event.comment.author_association }}" = 'OWNER'
            test "${{ github.actor }}" = "${{ github.repository_owner }}"
          fi
          test "$EXPECTED_PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'

      - name: Authenticate exact Asset Factory WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}

      - name: Grant exact resource-scoped Secret Accessor where canonical Runway secret exists
        id: grant
        shell: bash
        run: |
          set -euo pipefail
          found=0
          granted=0
          for secret in RUNWAY_API_KEY RUNWAYML_API_SECRET; do
            if gcloud secrets describe "$secret" --project="$EXPECTED_PROJECT_ID" --quiet >/dev/null 2>&1; then
              found=$((found+1))
              gcloud secrets add-iam-policy-binding "$secret"                 --project="$EXPECTED_PROJECT_ID"                 --member="serviceAccount:$GCP_DEPLOY_SERVICE_ACCOUNT"                 --role='roles/secretmanager.secretAccessor'                 --quiet >/dev/null
              gcloud secrets versions access latest                 --secret="$secret"                 --project="$EXPECTED_PROJECT_ID"                 --quiet >/dev/null
              granted=$((granted+1))
              echo "Secret metadata/access verified for $secret; value not emitted."
            fi
          done
          test "$found" -ge 1 || { echo 'No canonical Runway secret exists under the admitted names.' >&2; exit 61; }
          test "$granted" = "$found" || { echo 'Not every existing canonical Runway secret became readable.' >&2; exit 62; }
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "granted=$granted" >> "$GITHUB_OUTPUT"

      - name: Post sanitized grant result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.grant.outputs.found }}
          GRANTED: ${{ steps.grant.outputs.granted }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 326 --repo "$GITHUB_REPOSITORY" --body "RUNWAY_RETENTION_SECRET_ACCESS_GRANTED=$GITHUB_RUN_ID; exact_main=$GITHUB_SHA; existing_canonical_secrets=$FOUND; resource_scoped_secret_accessor_grants=$GRANTED; secret_values_exposed=false; service_account=$GCP_DEPLOY_SERVICE_ACCOUNT"

      - name: Remove ephemeral Google credential
        if: always()
        shell: bash
        run: |
          rm -f -- "${GOOGLE_APPLICATION_CREDENTIALS:-}" || true
          echo 'GOOGLE_APPLICATION_CREDENTIALS=' >> "$GITHUB_ENV"
          echo 'GOOGLE_GHA_CREDS_PATH=' >> "$GITHUB_ENV"

  report-failure:
    if: failure()
    needs: grant-access
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post fail-closed result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 326 --repo "$GITHUB_REPOSITORY" --body "RUNWAY_RETENTION_SECRET_ACCESS_NOT_GRANTED=$GITHUB_RUN_ID; exact_main=$GITHUB_SHA; provider_generation=false; provider_mutation=false; no_secret_value_exposed=true. Inspect workflow failure to determine whether secret IAM setPolicy requires external cloud-admin authority."
