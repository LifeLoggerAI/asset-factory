name: Shared Artifact Address Policy

on:
  pull_request:
    paths:
      - model_forge/protected-artifact.mjs
      - scripts/test-protected-artifact.mjs
      - .github/workflows/shared-artifact-address-policy.yml
  push:
    branches: [repair/shared-artifact-address-policy-20261007-holdings]
    paths:
      - model_forge/protected-artifact.mjs
      - scripts/test-protected-artifact.mjs
      - .github/workflows/shared-artifact-address-policy.yml

permissions:
  contents: read

concurrency:
  group: artifact-address-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  synthetic-artifact-address-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean source identity
        run: |
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Actual address DNS socket and byte bounds with synthetic transport
        run: node --test scripts/test-protected-artifact.mjs
      - name: Tracked source parity
        run: git diff --exit-code HEAD
