name: Asset Factory Pipeline Proof

on:
  push:
    paths:
      - 'assetfactory-studio/**'
      - 'image_asset_generator/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/asset-factory-pipeline-proof.yml'
      - 'LAUNCH_READINESS.md'
      - 'README.md'
      - 'docs/release-evidence/URAI-AF-20260711-V1-RESUME-CREDENTIAL-ISOLATION-001.md'
  pull_request:
    paths:
      - 'assetfactory-studio/**'
      - 'image_asset_generator/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/asset-factory-pipeline-proof.yml'
      - 'LAUNCH_READINESS.md'
      - 'README.md'
      - 'docs/release-evidence/URAI-AF-20260711-V1-RESUME-CREDENTIAL-ISOLATION-001.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-factory-pipeline-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  ASSET_FACTORY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  asset-factory-proof:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: image_asset_generator/requirements.txt

      - name: Install studio dependencies
        working-directory: assetfactory-studio
        run: npm install

      - name: Run launch static gates
        run: |
          npm run test:launch-readiness
          npm run test:completion-lock
          npm run check:deploy-workflow

      - name: Resolve active production dependency locks
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --lockfile-only --no-frozen-lockfile
          npm --prefix assetfactory-studio install --package-lock-only --ignore-scripts
          npm --prefix life-map-pipeline/functions install --package-lock-only --ignore-scripts
          npm --prefix engine install --package-lock-only --ignore-scripts
          npm --prefix engine audit fix --package-lock-only --omit=dev --ignore-scripts

      - name: Commit regenerated dependency locks
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml assetfactory-studio/package-lock.json life-map-pipeline/functions/package-lock.json engine/npm-shrinkwrap.json
          if git diff --cached --quiet; then
            echo "Dependency locks already match current package constraints."
          else
            git commit -m "chore: refresh production dependency locks"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run blocking production dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:production

      - name: Record full-workspace dependency debt
        if: always()
        shell: bash
        run: |
          set +e
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm audit --audit-level=high > workspace-dependency-debt.txt 2>&1
          rc=$?
          set -e
          printf 'workspace_audit_exit=%s\n' "$rc" >> workspace-dependency-debt.txt
          printf 'production_gate_scope=assetfactory-studio,life-map-pipeline/functions,engine\n' >> workspace-dependency-debt.txt
          printf 'legacy_functions_deploy_authority=false\n' >> workspace-dependency-debt.txt

      - name: Upload dependency resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-factory-dependency-evidence-${{ env.ASSET_FACTORY_EXACT_HEAD }}
          path: |
            pnpm-lock.yaml
            assetfactory-studio/package-lock.json
            life-map-pipeline/functions/package-lock.json
            engine/npm-shrinkwrap.json
            workspace-dependency-debt.txt
          if-no-files-found: error
          retention-days: 14

      - name: Lint Studio
        working-directory: assetfactory-studio
        run: npm run lint

      - name: Typecheck Studio
        working-directory: assetfactory-studio
        run: npm run typecheck

      - name: Test Studio
        working-directory: assetfactory-studio
        run: npm test

      - name: Validate production assets
        id: production_asset_validation
        working-directory: assetfactory-studio
        shell: bash
        run: |
          set -o pipefail
          npm run validate:assets 2>&1 | tee ../asset-factory-production-validation.log

      - name: Upload production validation diagnostic
        if: ${{ steps.production_asset_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-factory-production-validation-${{ env.ASSET_FACTORY_EXACT_HEAD }}-${{ github.run_id }}
          path: asset-factory-production-validation.log
          if-no-files-found: error

      - name: Validate runtime contract
        working-directory: assetfactory-studio
        run: npm run validate:runtime

      - name: Validate Firebase rules
        working-directory: assetfactory-studio
        run: npm run validate:rules

      - name: Validate Firebase deploy preflight
        working-directory: assetfactory-studio
        run: npm run validate:deploy

      - name: Build Studio
        working-directory: assetfactory-studio
        run: npm run build

      - name: Run studio multimodal E2E
        run: npm --prefix assetfactory-studio run e2e

      - name: Install image pipeline dependencies
        run: python -m pip install -r image_asset_generator/requirements.txt

      - name: Test production visual gate contracts
        run: python -m unittest discover -s image_asset_generator -p 'test_production_visual_gate.py' -v

      - name: Run offline image asset mechanical proof
        id: offline_image_proof
        env:
          ASSET_RENDERER_MODE: offline
          ASSET_PIPELINE_REQUIRE_PRODUCTION_VISUALS: "0"
        run: python image_asset_generator/run_pipeline.py

      - name: Exercise production-required negative path
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ASSET_RENDERER_MODE=offline \
          ASSET_PIPELINE_REQUIRE_PRODUCTION_VISUALS=1 \
            python image_asset_generator/run_pipeline.py > production-visual-negative.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q "Production visual gate is required and remains blocked." production-visual-negative.log
          grep -q '"production_visual_authority": false' image_asset_generator/production_visual_gate.json
          echo "Production-required negative path failed closed without provider mode."

      - name: Assert retained proof is explicitly non-production and self-describing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          base = Path("image_asset_generator")
          report = json.loads((base / "validation_report.json").read_text())
          gate = json.loads((base / "production_visual_gate.json").read_text())
          seed = json.loads((base / "firebase_seed.json").read_text())

          if report.get("status") != "passed":
              raise SystemExit("mechanical pipeline report did not pass")
          if report.get("status_scope") != "mechanical_integrity_only":
              raise SystemExit("mechanical proof status scope is missing or ambiguous")
          if report.get("proof_classification", {}).get("scope") != "mechanical-diagnostic":
              raise SystemExit("proof classification is missing or ambiguous")
          if gate.get("status") != "blocked" or gate.get("production_visual_authority") is not False:
              raise SystemExit("offline proof must remain blocked from production visual authority")
          if gate.get("promotion_allowed") is not False:
              raise SystemExit("offline proof must remain blocked from promotion")
          if not gate.get("non_provider_assets"):
              raise SystemExit("offline proof must identify non-provider render provenance")
          if seed.get("productionEligible") is not False:
              raise SystemExit("offline Firebase seed must not be production eligible")
          if seed.get("productionGateEligible") is not False:
              raise SystemExit("offline Firebase seed must inherit the blocked global gate")
          if seed.get("usagePolicy") != "diagnostic-only-do-not-promote":
              raise SystemExit("offline Firebase seed must be diagnostic-only")

          required = {
              "validation_report.json",
              "production_visual_gate.json",
              "firebase_seed.json",
              "preview.html",
              "manifest.json",
          }
          with ZipFile(base / "asset_pack.zip") as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"asset pack missing proof file(s): {missing}")
              for name in ("validation_report.json", "production_visual_gate.json", "firebase_seed.json"):
                  if archive.read(name) != (base / name).read_bytes():
                      raise SystemExit(f"asset pack contains stale {name}")
              png_count = sum(name.endswith(".png") for name in names)
              metadata_count = sum(name.endswith(".png.render.json") for name in names)
              if png_count != report.get("asset_count") or metadata_count != report.get("asset_count"):
                  raise SystemExit("asset pack output/provenance counts do not match report")

          print("Retained image proof is truthful: mechanical PASS, production visual BLOCKED.")
          PY

      - name: Upload image pipeline mechanical proof
        if: ${{ steps.offline_image_proof.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-factory-image-mechanical-proof-${{ env.ASSET_FACTORY_EXACT_HEAD }}-${{ github.run_id }}
          path: |
            image_asset_generator/validation_report.json
            image_asset_generator/production_visual_gate.json
            image_asset_generator/firebase_seed.json
            image_asset_generator/asset_pack.zip
            image_asset_generator/preview.html
          if-no-files-found: error
