name: One-Time V4 Exact Five Recovery

on:
  push:
    branches: [main]
    paths:
      - authorizations/execute-v4-exact-five-recovery-20260730.json

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-v4-exact-five-recovery-20260730
  cancel-in-progress: false

jobs:
  recover:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: paid-asset-generation
    env:
      AUTHORIZATION_MARKER: authorizations/execute-v4-exact-five-recovery-20260730.json
      SOURCE_ARTIFACT_ID: '8763242401'
      OUTPUT_ROOT: artifacts/exact-paid/v4-recovery
      ASSET_RENDERER_PROVIDER: openai
      ASSET_RENDERER_ENDPOINT: https://api.openai.com/v1/images/generations
      ASSET_RENDERER_MODEL: gpt-image-2
      ASSET_RENDERER_ALPHA_MODEL: gpt-image-1.5
      ASSET_RENDERER_MODE: provider
      ASSET_RENDERER_MAX_ATTEMPTS: '1'
      ASSET_FORGE_REQUIRE_PROVIDER: '1'
      ASSET_QUALITY_REQUIRE_PROVIDER: '1'
      ASSET_FORGE_PAID_RUN_AUTHORIZED: '1'
      ASSET_FORGE_MAX_PROVIDER_CALLS: '10'
      ASSET_FORGE_MAX_UNIT_COST_USD: '1.00'
      ASSET_FORGE_MAX_COST_USD: '10.00'
      ASSET_FORGE_MAX_ROUNDS: '1'
      ASSET_FORGE_RUN_ID: ${{ github.run_id }}-v4-exact-five-recovery
      ASSET_FORGE_BUDGET_STATE_PATH: ${{ github.workspace }}/artifacts/budget/v4-five-recovery-paid-request-state.json
    steps:
      - name: Checkout exact recovery authorization
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact clean one-marker trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = "$AUTHORIZATION_MARKER"
          test -z "${URAI_WHEEL_GITHUB_TOKEN:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned generator dependencies
        run: python -m pip install -r image_asset_generator/requirements.txt

      - name: Download exact retained V4 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$RUNNER_TEMP/v4-artifact.json"
          python - "$RUNNER_TEMP/v4-artifact.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          assert payload['id']==8763242401,payload
          assert payload['name']=='urai-v4-exact-paid-30543824770',payload
          assert payload['expired'] is False,payload
          assert payload.get('digest')=='sha256:b99e5e7d653cbf4a02d41504387cc59ee1c3a8f7dea45f5825d75664e910daa9',payload
          assert payload.get('workflow_run',{}).get('head_sha')=='c388b1ce3d6fc27ef30599eb6535605bff202fb7',payload
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/v4-retained.zip"
          mkdir -p "$RUNNER_TEMP/v4-retained"
          unzip -q "$RUNNER_TEMP/v4-retained.zip" -d "$RUNNER_TEMP/v4-retained"

      - name: Compile exact V4 recovery runner
        run: python -m py_compile scripts/recover_exact_v4_failed_assets.py

      - name: Recover only the exact five failed V4 assets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python scripts/recover_exact_v4_failed_assets.py \
            --authorization "$AUTHORIZATION_MARKER" \
            --retained-root "$RUNNER_TEMP/v4-retained" \
            --output-root "$OUTPUT_ROOT"

      - name: Prove bounded full V4 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - "$OUTPUT_ROOT/v4-generation-receipt.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          assert payload['version']=='v4',payload
          assert payload['status']=='passed',payload
          assert payload['generated']==39,payload
          assert payload['passed']==39,payload
          assert payload['failed']==0,payload
          assert payload['retainedPassed']==34,payload
          assert len(payload['retriedNames'])==5,payload
          assert payload['providerCallsExecutedThisRetry']<=10,payload
          assert float(payload['reservedEstimatedCostUsdThisRetry'])<=10.0,payload
          assert payload['promotionAuthorized'] is False,payload
          assert payload['deploymentAuthorized'] is False,payload
          print(json.dumps({key:payload.get(key) for key in ('status','generated','passed','failed','providerCallsExecutedThisRetry','reservedEstimatedCostUsdThisRetry','providerCallsExecutedCumulativeV4','reservedEstimatedCostUsdCumulativeV4')},sort_keys=True))
          PY

      - name: Upload immutable V4 recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-v4-exact-five-recovery-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            authorizations/execute-v4-exact-five-recovery-20260730.json
            artifacts/budget/v4-five-recovery-paid-request-state.json
            artifacts/exact-paid/v4-recovery/**
            image_asset_generator/manifests/generated/v4-canonical.manifest.json
