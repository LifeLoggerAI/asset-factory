name: Protected Image Spend Executor

on:
  pull_request:
    paths:
      - image_asset_generator/**
      - assetfactory-studio/lib/server/productionSpend.ts
      - assetfactory-studio/app/api/worker/production-spend/**
      - scripts/check_paid_forge_gate.py
      - scripts/test-production-spend-gateway.mjs
      - scripts/generate_exact_version_assets.py
      - scripts/generate_before_rest_world_proof.py
      - scripts/generate_before_rest_world_repair.py
      - scripts/recover_exact_v4_failed_assets.py
      - docs/production/image-spend-executor.md
      - docs/production/image-spend-executor-receipt.json
      - .github/workflows/production-image-spend-executor.yml
  push:
    branches: [main]
    paths:
      - image_asset_generator/**
      - assetfactory-studio/lib/server/productionSpend.ts
      - assetfactory-studio/app/api/worker/production-spend/**
      - scripts/check_paid_forge_gate.py
      - scripts/test-production-spend-gateway.mjs
      - scripts/generate_exact_version_assets.py
      - scripts/generate_before_rest_world_proof.py
      - scripts/generate_before_rest_world_repair.py
      - scripts/recover_exact_v4_failed_assets.py
      - docs/production/image-spend-executor.md
      - docs/production/image-spend-executor-receipt.json
      - .github/workflows/production-image-spend-executor.yml

permissions:
  contents: read

concurrency:
  group: protected-image-spend-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  URAI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  synthetic-spend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install pinned test dependencies without provider credentials
        shell: bash
        run: |
          python -m pip install Pillow==12.3.0
          npm install --prefix "$RUNNER_TEMP/spend-compiler" --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@22.20.0
      - name: Verify exact Labs offline contract copy
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          assert sha256(Path('image_asset_generator/spend_preflight_contract.py').read_bytes()).hexdigest() == '88630dc57c2617a62128d6070b9a353f53446bade9400dd0f4ad2b84fa5e281a'
          PY
      - name: Typecheck protected transaction helper
        shell: bash
        run: |
          node "$RUNNER_TEMP/spend-compiler/node_modules/typescript/bin/tsc" --strict --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --typeRoots "$RUNNER_TEMP/spend-compiler/node_modules/@types" assetfactory-studio/lib/server/productionSpend.ts
      - name: Exercise actual gateway and HTTP route with synthetic signed records
        run: node --experimental-strip-types --experimental-vm-modules --test scripts/test-production-spend-gateway.mjs
      - name: Exercise actual image leaf and retained offline contract without provider calls
        run: python scripts/check_paid_forge_gate.py
      - name: Compile migrated image callers
        run: python -m py_compile image_asset_generator/paid_request_guard.py image_asset_generator/provider_renderer.py image_asset_generator/cost_guarded_renderer.py scripts/generate_exact_version_assets.py scripts/generate_before_rest_world_proof.py scripts/generate_before_rest_world_repair.py scripts/recover_exact_v4_failed_assets.py
      - name: Final clean tracked source proof
        run: git diff --exit-code HEAD
