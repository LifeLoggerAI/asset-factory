name: Built From Survival Hero Cinema Verify

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/built-from-survival-hero-cinema-verify.yml
      - .github/workflows/one-time-built-from-survival-hero-cinema.yml
      - manifests/film/built-from-survival-hero-cinema.manifest.json
      - scripts/generate_built_from_survival_hero_cinema.py
      - scripts/resume_built_from_survival_hero_cinema.py
      - scripts/test-paid-workflow-current-authorities.py
      - authorizations/execute-built-from-survival-hero-cinema-20260829.json
      - authorizations/resume-built-from-survival-hero-cinema-20260829.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile bounded generators
        run: python -m py_compile scripts/generate_built_from_survival_hero_cinema.py scripts/resume_built_from_survival_hero_cinema.py

      - name: Verify exact bounded resume support contract
        shell: bash
        run: |
          set -euo pipefail
          test -e authorizations/execute-built-from-survival-hero-cinema-20260829.json
          test -e authorizations/resume-built-from-survival-hero-cinema-20260829.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifests/film/built-from-survival-hero-cinema.manifest.json').read_text())
          resume_authority = json.loads(Path('authorizations/resume-built-from-survival-hero-cinema-20260829.json').read_text())
          assert manifest['schemaVersion'] == '1.0.0'
          assert manifest['programAuthorityRepository'] == 'LifeLoggerAI/urai-studio'
          assert manifest['programAuthoritySha'] == '802f909ecad2bd000e4c8011a14bc3340fe88950'
          assert manifest['projectId'] == 'urai-life-film-001-built-from-survival-hero-cinema'
          assert manifest['provider'] == 'openai'
          assert manifest['videoModel'] == 'sora-2'
          assert manifest['videoSize'] == '1280x720'
          assert manifest['secondsPerSourceClip'] == '12'
          assert manifest['publicReleaseAuthorized'] is False
          assert manifest['generatedImageryIsRecreation'] is True
          assert [s['id'] for s in manifest['shots']] == ['GEN-01','GEN-02','GEN-03','GEN-04','GEN-05']
          assert all(s['classification'] in {'cinematic-recreation','concept-visualization'} for s in manifest['shots'])
          assert all(len(s['prompt'].strip()) >= 180 for s in manifest['shots'])
          assert resume_authority['schemaVersion'] == '1.0.0'
          assert resume_authority['mode'] == 'resume-existing-generation'
          assert resume_authority['programAuthorityRepository'] == 'LifeLoggerAI/urai-studio'
          assert resume_authority['programAuthoritySha'] == '802f909ecad2bd000e4c8011a14bc3340fe88950'
          assert resume_authority['executionAuthorityRepository'] == 'LifeLoggerAI/asset-factory'
          assert resume_authority['executionAuthorityPullRequest'] == 255
          assert resume_authority['provider'] == 'openai'
          assert resume_authority['priorRunId'] == 33237442786
          assert resume_authority['priorArtifactId'] == 9710419037
          assert resume_authority['maximumProviderCalls'] == 5
          assert resume_authority['providerCreateCallsPreviouslyExecuted'] == 2
          assert resume_authority['maximumNewProviderCalls'] == 3
          assert resume_authority['maximumReservedCostUsd'] == '8.00'
          assert resume_authority['existingProviderJobs'] == {
            'GEN-01': 'video_6a927644a858819184b9ab460ce9e0a00b8ca47e894f0559',
            'GEN-02': 'video_6a9276ec7e488193a7501cd2ae2aeac40478f6bc6ff28d70',
          }
          for field in [
            'automaticRetryAuthorized',
            'generationRetryAuthorized',
            'remixAuthorized',
            'promotionAuthorized',
            'deliveryAuthorized',
            'deploymentAuthorized',
            'publicReleaseAuthorized',
            'editorialPromotionAuthorized',
          ]:
            assert resume_authority[field] is False, field
          assert resume_authority['privateReviewAuthorized'] is True
          assert resume_authority['generatedImageryIsRecreation'] is True
          workflow = Path('.github/workflows/one-time-built-from-survival-hero-cinema.yml').read_text()
          resume = Path('scripts/resume_built_from_survival_hero_cinema.py').read_text()
          for required in [
            'environment: paid-asset-generation',
            'authorizations/resume-built-from-survival-hero-cinema-20260829.json',
            'EXECUTION_MODE=resume',
            'gh run download "$PRIOR_RUN_ID"',
            'Resume without regenerating existing provider jobs',
            'providerCreateCallsPreviouslyExecuted',
            'providerCreateCallsExecutedThisRun',
            'providerCreateCallsLifetime',
          ]: assert required in workflow, required
          for required in [
            'EXPECTED_PRIOR_RUN=33237442786',
            'EXPECTED_PRIOR_ARTIFACT=9710419037',
            "EXPECTED_GEN01_ID='video_6a927644a858819184b9ab460ce9e0a00b8ca47e894f0559'",
            "EXPECTED_GEN02_ID='video_6a9276ec7e488193a7501cd2ae2aeac40478f6bc6ff28d70'",
            'MAX_NEW_CREATE_CALLS=3',
            'MAX_LIFETIME_CREATE_CALLS=5',
            "MAX_RESERVED_SPEND_USD='8.00'",
            'replacement generation is not authorized',
            "generationRetryAuthorized':False",
          ]: assert required in resume, required
          print('Built From Survival hero cinema bounded resume support: PASS (no provider execution)')
          PY
