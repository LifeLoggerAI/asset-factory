name: Cancel Superseded V2 Retry 30630048866

on:
  push:
    branches: [repair/v2-certified-gaps-20260730]
    paths:
      - .github/workflows/cancel-superseded-v2-retry-30630048866.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate paid retry
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: '30630048866'
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/cancel"
