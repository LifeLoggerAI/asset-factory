name: Replicate Bounded Model3D Smoke — Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replicate-bounded-model3d-smoke-quarantined
  cancel-in-progress: false

jobs:
  verify-quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify fail-closed provider-spend boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'Replicate model3d paid smoke is intentionally quarantined.'
          echo 'This workflow has no provider credential inputs and performs no provider API call.'
          echo 'A future one-time provider smoke requires a separately reviewed, explicit, bounded workflow and must not use long-lived Google credentials.'
