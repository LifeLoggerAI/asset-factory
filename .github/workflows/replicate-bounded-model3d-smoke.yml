      - name: Authenticate to Google Cloud with trusted WIF
        id: diagnostic_google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node for trusted secret read
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI for trusted secret read
        run: npm install -g firebase-tools

      - name: Load Replicate token without exposing it
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.diagnostic_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          token="$(firebase apphosting:secrets:access REPLICATE_API_TOKEN --project "$PROJECT_ID" --non-interactive 2>"$RUNNER_TEMP/home-diagnostic-secret.stderr")"
          test -n "$token" || { cat "$RUNNER_TEMP/home-diagnostic-secret.stderr" >&2 || true; exit 1; }
          echo "::add-mask::$token"
          printf 'REPLICATE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token

      - name: Remove ephemeral Google credential before provider read
        env:
          CREDENTIAL_PATH: ${{ steps.diagnostic_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CREDENTIAL_PATH"
          case "$CREDENTIAL_PATH" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path; refusing cleanup outside generated WIF file." >&2; exit 1 ;;
          esac
          rm -f -- "$CREDENTIAL_PATH"
          test ! -e "$CREDENTIAL_PATH"

      - name: Read existing Replicate prediction without creating a prediction
        id: diagnostic
        env:
          PREDICTION_ID: q7b3jqfr79rmy0d0yt6anbhrgw
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REPLICATE_API_TOKEN:-}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            "https://api.replicate.com/v1/predictions/$PREDICTION_ID" \
            -o "$RUNNER_TEMP/home-prediction-diagnostic.raw.json"
          jq '{id,status,error,logs,metrics,model,version,created_at,started_at,completed_at}' \
            "$RUNNER_TEMP/home-prediction-diagnostic.raw.json" \
            > "$RUNNER_TEMP/home-prediction-diagnostic.json"
          jq -e --arg id "$PREDICTION_ID" '.id == $id' "$RUNNER_TEMP/home-prediction-diagnostic.json" >/dev/null
          status="$(jq -r '.status // "unknown"' "$RUNNER_TEMP/home-prediction-diagnostic.json")"
          error="$(jq -r '.error // "null"' "$RUNNER_TEMP/home-prediction-diagnostic.json" | tr '\n\r' '  ' | cut -c1-1200)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "error<<EOF"
            echo "$error"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable no-spend diagnostic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-challenger-provider-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/home-prediction-diagnostic.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Record diagnostic result without retry or promotion
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnostic.outputs.status }}
          ERROR_TEXT: ${{ steps.diagnostic.outputs.error }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 315 --repo "$GITHUB_REPOSITORY" --body "HOME_CHALLENGER_DIAGNOSTIC=${GITHUB_RUN_ID}; prediction=q7b3jqfr79rmy0d0yt6anbhrgw; status=${STATUS}; provider_error=${ERROR_TEXT}; paid_predictions_created=0; automatic_retry=false; promoted=false; artifact=home-challenger-provider-diagnostic-${GITHUB_SHA}-${GITHUB_RUN_ID}"

      - name: Remove temporary diagnostic provider files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/home-diagnostic-secret.stderr"
          rm -f "$RUNNER_TEMP/home-prediction-diagnostic.raw.json"
          rm -f "${{ steps.diagnostic_google_auth.outputs.credentials_file_path }}" || true
          printf 'REPLICATE_API_TOKEN=\n' >> "$GITHUB_ENV"

