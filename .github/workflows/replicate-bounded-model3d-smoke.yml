    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: asset-factory-production
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact read-only owner authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test '${{ github.event.issue.number }}' = '55'
          test '${{ github.event.comment.author_association }}' = 'OWNER'
          test '${{ github.event.comment.body }}' = 'READBACK_ASSET_FACTORY_CUSTOM_DOMAIN'
          test "$GITHUB_WORKFLOW_REF" = 'LifeLoggerAI/asset-factory/.github/workflows/replicate-bounded-model3d-smoke.yml@refs/heads/main'
          test "$PROJECT_ID" = 'urai-4dc1d'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Authenticate with existing authorized Asset Factory WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read Firebase Hosting site and custom-domain metadata only
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/domain-readback"
          token="$(gcloud auth print-access-token)"
          test -n "$token"
          echo "::add-mask::$token"
          sites_status="$(curl --silent --show-error \
            -o "$RUNNER_TEMP/domain-readback/sites.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites")"
          custom_status='not-attempted'
          if test "$sites_status" = '200'; then
            custom_status="$(curl --silent --show-error \
              -o "$RUNNER_TEMP/domain-readback/custom-domains.json" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$PROJECT_ID/customDomains")"
          fi
          unset token
          SITES_STATUS="$sites_status" CUSTOM_STATUS="$custom_status" node <<'NODE'
          const fs = require('node:fs');
          let sites = null;
          try { sites = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/domain-readback/sites.json','utf8')); } catch {}
          let custom = null;
          try { custom = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/domain-readback/custom-domains.json','utf8')); } catch {}
          const wanted = new Set(['uraiassetfactory.com','www.uraiassetfactory.com']);
          const domains = Array.isArray(custom?.customDomains) ? custom.customDomains.map((d)=>({
            name:d.name || null,
            hostState:d.hostState || null,
            certState:d.certState || null,
            issues:d.issues || [],
            createTime:d.createTime || null,
            updateTime:d.updateTime || null,
          })).filter((d)=>wanted.has(String(d.name||'').split('/').pop())) : [];
          const receipt = {
            schemaVersion:'urai-asset-factory-custom-domain-readback-1',
            projectId:process.env.PROJECT_ID,
            exactMain:process.env.GITHUB_SHA,
            sitesApiStatus:process.env.SITES_STATUS,
            customDomainApiStatus:process.env.CUSTOM_STATUS,
            authorityReadable:process.env.SITES_STATUS === '200' && process.env.CUSTOM_STATUS === '200',
            sites:(sites?.sites||[]).map((s)=>({name:s.name||null,defaultUrl:s.defaultUrl||null,type:s.type||null})),
            targetDomains:domains,
            nextAction: process.env.SITES_STATUS === '403'
              ? 'Current WIF service account lacks Firebase Hosting site-list read authority; grant only the minimum read permission through the governed IAM lane before retry.'
              : process.env.SITES_STATUS !== '200'
                ? 'Investigate Firebase Hosting site-list API status before any domain mutation.'
                : process.env.CUSTOM_STATUS !== '200'
                  ? 'Investigate Firebase Hosting custom-domain read authority/API state before any domain mutation.'
                  : 'Use hostState/certState to decide the smallest governed domain repair.',
            providerMutationPerformed:false,
            secretValuesRead:false,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/domain-readback/receipt.json', JSON.stringify(receipt,null,2)+'\n');
          console.log('SITES_API_STATUS='+receipt.sitesApiStatus);
          console.log('CUSTOM_DOMAIN_API_STATUS='+receipt.customDomainApiStatus);
          console.log('AUTHORITY_READABLE='+receipt.authorityReadable);
          console.log('TARGET_CUSTOM_DOMAIN_COUNT='+domains.length);
          for (const d of domains) console.log('CUSTOM_DOMAIN='+String(d.name).split('/').pop()+' HOST_STATE='+d.hostState+' CERT_STATE='+d.certState);
          NODE

      - name: Record sanitized readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(node -e "const r=require(process.env.RUNNER_TEMP+'/domain-readback/receipt.json'); console.log('sites_api_status='+r.sitesApiStatus+' custom_api_status='+r.customDomainApiStatus+' authority_readable='+r.authorityReadable+' target_count='+r.targetDomains.length+' targets='+r.targetDomains.map(d=>(d.name||'').split('/').pop()+':host='+d.hostState+':cert='+d.certState).join(',')+' next_action='+r.nextAction)")"
          gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "ASSET_FACTORY_CUSTOM_DOMAIN_READBACK=$GITHUB_RUN_ID; exact_main=$GITHUB_SHA; $summary; provider_mutation=false; secret_values_read=false"

      - name: Upload sanitized custom-domain metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asset-factory-custom-domain-readback-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/domain-readback/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "${GOOGLE_APPLICATION_CREDENTIALS:-}" "$RUNNER_TEMP/domain-readback/custom-domains.stderr" || true
          echo 'GOOGLE_APPLICATION_CREDENTIALS=' >> "$GITHUB_ENV"
          echo 'GOOGLE_GHA_CREDS_PATH=' >> "$GITHUB_ENV"


  report:
    if: github.event_name == 'workflow_dispatch' && always()
