name: Replicate Bounded Model3D Smoke — Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replicate-bounded-model3d-smoke-quarantined
  cancel-in-progress: false

jobs:
  verify-quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify fail-closed provider-spend boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          if grep -Eq 'FIREBASE_SERVICE_ACCOUNT|FIREBASE_PRIVATE_KEY|credentials_json|firebase-service-account\.json' .github/workflows/replicate-bounded-model3d-smoke.yml; then
            echo 'Long-lived Google credential material is forbidden in the quarantined smoke workflow.' >&2
            exit 1
          fi
          if grep -Eq 'api\.replicate\.com/v1/predictions|REPLICATE_API_TOKEN' .github/workflows/replicate-bounded-model3d-smoke.yml; then
            echo 'Paid Replicate execution is forbidden in the quarantined smoke workflow.' >&2
            exit 1
          fi
          echo 'Replicate model3d paid smoke is intentionally quarantined.'
          echo 'A future one-time provider smoke requires a separately reviewed, explicit, bounded workflow and must not use long-lived Google credentials.'
