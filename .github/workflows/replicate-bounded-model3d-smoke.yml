name: Replicate Bounded Model3D Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_smoke:
        description: Type RUN_ONE_REPLICATE_MODEL3D_SMOKE to authorize exactly one paid Replicate prediction
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: replicate-bounded-model3d-smoke
  cancel-in-progress: false

env:
  PROJECT_ID: urai-4dc1d
  GCP_WIF_PROVIDER: projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github
  GCP_DEPLOY_SERVICE_ACCOUNT: asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com
  MODEL_VERSION: tencent/hunyuan-3d-3.1:a2838628b41a2e0ee2eb19b3ea98a40d75f8d7639bf5a1ddd37ea299bb334854

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: asset-factory-production
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      skipped: ${{ steps.preflight.outputs.skip }}
      prediction_id: ${{ steps.run.outputs.prediction_id }}
      asset_sha256: ${{ steps.run.outputs.asset_sha256 }}
      asset_bytes: ${{ steps.run.outputs.asset_bytes }}
    steps:
      - name: Require exact paid-smoke authorization
        shell: bash
        env:
          CONFIRM_PAID_SMOKE: ${{ inputs.confirm_paid_smoke }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo '::error::Paid smoke may only run from main.'; exit 64; }
          test "$CONFIRM_PAID_SMOKE" = 'RUN_ONE_REPLICATE_MODEL3D_SMOKE' || { echo '::error::Exact paid-smoke confirmation phrase was not supplied.'; exit 65; }

      - name: Check one-time smoke marker
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh issue view 63 --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(contains("REPLICATE_MODEL3D_SMOKE_COMPLETED="))] | length')"
          if [ "$count" -gt 0 ]; then
            echo "A completed Replicate model3d smoke is already recorded; refusing a second paid prediction."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify pinned WIF identity contract
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'

      - name: Authenticate to Google Cloud with WIF
        id: google_auth
        if: steps.preflight.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: steps.preflight.outputs.skip != 'true'
        run: npm install -g firebase-tools

      - name: Load Replicate token from Secret Manager
        if: steps.preflight.outputs.skip != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          token="$(firebase apphosting:secrets:access REPLICATE_API_TOKEN --project "$PROJECT_ID" --non-interactive 2>"$RUNNER_TEMP/secret-access.stderr")"
          if [ -z "$token" ]; then
            cat "$RUNNER_TEMP/secret-access.stderr" >&2 || true
            echo "Secret Manager returned an empty Replicate token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'REPLICATE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token

      - name: Remove ephemeral Google credential
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          CREDENTIAL_PATH: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          if [ -n "${CREDENTIAL_PATH:-}" ]; then
            rm -f -- "$CREDENTIAL_PATH"
            test ! -e "$CREDENTIAL_PATH"
          fi

      - name: Run exactly one Replicate model3d prediction
        id: run
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          request="$RUNNER_TEMP/replicate-request.json"
          current="$RUNNER_TEMP/replicate-current.json"
          cat > "$request" <<EOF
          {
            "version": "${MODEL_VERSION#*:}",
            "input": {
              "prompt": "A single smooth river stone, rounded natural asymmetrical shape, clean watertight geometry, isolated object, no text, no base, no extra objects",
              "enable_pbr": false,
              "face_count": 40000,
              "generate_type": "Geometry"
            }
          }
          EOF

          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$request" \
            https://api.replicate.com/v1/predictions > "$current"

          prediction_id="$(jq -r '.id // empty' "$current")"
          get_url="$(jq -r '.urls.get // empty' "$current")"
          cancel_url="$(jq -r '.urls.cancel // empty' "$current")"
          if [ -z "$prediction_id" ] || [ -z "$get_url" ]; then
            jq '{id, status, error}' "$current" >&2 || true
            echo "Replicate did not return a prediction id/get URL."
            exit 1
          fi

          completed=false
          for attempt in $(seq 1 60); do
            status="$(jq -r '.status // empty' "$current")"
            if [ "$status" = "succeeded" ]; then
              completed=true
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "canceled" ]; then
              jq '{id, status, error, metrics}' "$current" >&2 || true
              echo "Replicate prediction ended with status $status."
              exit 1
            fi
            sleep 5
            curl -fsS --max-time 30 -H "Authorization: Bearer $REPLICATE_API_TOKEN" "$get_url" > "$current"
          done

          if [ "$completed" != true ]; then
            if [ -n "$cancel_url" ]; then
              curl -sS --max-time 30 -X POST -H "Authorization: Bearer $REPLICATE_API_TOKEN" "$cancel_url" >/dev/null || true
            fi
            echo "Replicate smoke timed out; the prediction was not retried."
            exit 1
          fi

          output_url="$(jq -r '.output // empty' "$current")"
          if [ -z "$output_url" ] || [[ "$output_url" != https://* ]]; then
            jq '{id, status, output, error}' "$current" >&2 || true
            echo "Replicate prediction did not return a valid HTTPS GLB URL."
            exit 1
          fi

          asset="$RUNNER_TEMP/replicate-model3d-smoke.glb"
          curl -fsSL --max-time 120 "$output_url" -o "$asset"
          bytes="$(stat -c%s "$asset")"
          if [ "$bytes" -le 0 ] || [ "$bytes" -gt 104857600 ]; then
            echo "Unexpected GLB size: $bytes bytes."
            exit 1
          fi
          magic="$(xxd -p -l 4 "$asset")"
          if [ "$magic" != "676c5446" ]; then
            echo "Downloaded output is not a binary glTF/GLB file."
            exit 1
          fi
          sha="$(sha256sum "$asset" | awk '{print $1}')"

          echo "prediction_id=$prediction_id" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "asset_bytes=$bytes" >> "$GITHUB_OUTPUT"
          jq '{id, status, metrics}' "$current"

      - name: Remove temporary provider files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/secret-access.stderr"
          rm -f "$RUNNER_TEMP/replicate-request.json"
          rm -f "$RUNNER_TEMP/replicate-current.json"
          rm -f "$RUNNER_TEMP/replicate-model3d-smoke.glb"


  home-provider-readiness:
    name: Home provider readiness — zero spend
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 315 &&
      github.event.comment.body == 'CHECK_HOME_PROVIDER_READINESS_NO_SPEND' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
    env:
      URAI_MODEL_FORGE_SPEND_AUTHORIZED: '0'
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove zero-spend readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test '${{ github.event.issue.number }}' = '315'
          test '${{ github.event.comment.author_association }}' = 'OWNER'
          test '${{ github.event.comment.body }}' = 'CHECK_HOME_PROVIDER_READINESS_NO_SPEND'
          test "$URAI_MODEL_FORGE_SPEND_AUTHORIZED" = 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --check model_forge/provider-preflight.mjs

      - name: Authenticate to Google Cloud with trusted WIF
        id: readiness_google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Read provider credentials and query balances only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.readiness_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          read_secret() {
            local name="$1"
            local value=""
            set +e
            value="$(firebase apphosting:secrets:access "$name" --project "$PROJECT_ID" --non-interactive 2>"$RUNNER_TEMP/$name.stderr")"
            local status=$?
            set -e
            if [ "$status" -ne 0 ] || [ -z "$value" ]; then
              printf '%s' ""
              return 0
            fi
            echo "::add-mask::$value"
            printf '%s' "$value"
          }

          meshy="$(read_secret MESHY_API_KEY)"
          tripo="$(read_secret TRIPO_API_KEY)"
          rodin="$(read_secret RODIN_API_KEY)"

          env \
            MESHY_API_KEY="$meshy" \
            TRIPO_API_KEY="$tripo" \
            RODIN_API_KEY="$rodin" \
            node model_forge/provider-preflight.mjs --live

          unset meshy tripo rodin
          jq '{
            schemaVersion,
            live,
            providers: [.providers[] | select(.provider == "meshy" or .provider == "tripo" or .provider == "rodin") | {
              provider,
              configured,
              balanceChecked,
              status,
              balance: (.balance // null),
              frozen: (.frozen // null),
              note: (.note // null)
            }]
          }' model-forge-provider-preflight.json > "$RUNNER_TEMP/home-provider-readiness.json"
          mv "$RUNNER_TEMP/home-provider-readiness.json" model-forge-provider-preflight.json

      - name: Remove ephemeral Google credential
        if: always()
        env:
          CREDENTIAL_PATH: ${{ steps.readiness_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CREDENTIAL_PATH:-}" ]; then
            case "$CREDENTIAL_PATH" in
              "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
              *) echo "Unexpected ADC credential path; refusing cleanup outside generated WIF file." >&2; exit 1 ;;
            esac
            rm -f -- "$CREDENTIAL_PATH"
            test ! -e "$CREDENTIAL_PATH"
          fi
          rm -f "$RUNNER_TEMP"/MESHY_API_KEY.stderr "$RUNNER_TEMP"/TRIPO_API_KEY.stderr "$RUNNER_TEMP"/RODIN_API_KEY.stderr

      - name: Upload sanitized Home provider readiness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-provider-readiness-${{ github.sha }}-${{ github.run_id }}
          path: model-forge-provider-preflight.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  home-challenger:
    name: One-shot Home architectural challenger
    if: >-
      github.event_name == 'issue_comment' &&
      (
        (github.event.issue.number == 315 && github.event.comment.body == 'AUTHORIZE_ONE_HOME_ARCHITECTURAL_CHALLENGER') ||
        (github.event.issue.number == 322 && github.event.comment.body == 'AUTHORIZE_REPLACEMENT_HOME_ARCHITECTURAL_CHALLENGER')
      ) &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: asset-factory-production
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      HOME_AUTHORIZATION_ISSUE: '${{ github.event.issue.number }}'
      HOME_EXPECTED_SPEC_BLOB: 0b6490e075ae3078286e2adbd040cce7a9a7608c
      URAI_MODEL_FORGE_SPEND_AUTHORIZED: '1'
      URAI_REPLICATE_MODEL: tencent/hunyuan-3d-3.1
      URAI_MODEL_FORGE_TIMEOUT_MS: '1200000'
      URAI_MODEL_FORGE_MAX_BYTES: '262144000'
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact authorization event and immutable Home spec
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test '${{ github.event.issue.number }}' = "$HOME_AUTHORIZATION_ISSUE"
          test '${{ github.event.comment.author_association }}' = 'OWNER'
          if [ "$HOME_AUTHORIZATION_ISSUE" = '315' ]; then
            test '${{ github.event.comment.body }}' = 'AUTHORIZE_ONE_HOME_ARCHITECTURAL_CHALLENGER'
          elif [ "$HOME_AUTHORIZATION_ISSUE" = '322' ]; then
            test '${{ github.event.comment.body }}' = 'AUTHORIZE_REPLACEMENT_HOME_ARCHITECTURAL_CHALLENGER'
          else
            echo "::error::Unexpected Home authorization issue"; exit 75
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          actual_blob="$(git hash-object model_forge/specs/home-architectural-sanctuary.json)"
          test "$actual_blob" = "$HOME_EXPECTED_SPEC_BLOB"
          node model_forge/forge.mjs \
            --spec model_forge/specs/home-architectural-sanctuary.json \
            --providers replicate \
            --dry-run > "$RUNNER_TEMP/home-challenger-plan.json"
          jq -e '.dryRun == true and .spendAuthorized == true and .assetId == "home-entry-chamber-v1" and (.providers | length) == 1 and .providers[0].provider == "replicate" and .generationPolicy.maxProviderAttempts == 1' "$RUNNER_TEMP/home-challenger-plan.json"

      - name: Refuse any previously started Home attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh issue view "$HOME_AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(contains("HOME_CHALLENGER_ATTEMPT_STARTED="))] | length')"
          test "$count" = 0 || { echo "::error::One-shot Home challenger attempt already started; refusing another provider call."; exit 73; }

      - name: Verify pinned WIF identity contract
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'

      - name: Authenticate to Google Cloud with trusted WIF
        id: home_google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node for trusted secret read
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI for trusted secret read
        run: npm install -g firebase-tools

      - name: Load Replicate token without exposing it
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.home_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          token="$(firebase apphosting:secrets:access REPLICATE_API_TOKEN --project "$PROJECT_ID" --non-interactive 2>"$RUNNER_TEMP/home-secret-access.stderr")"
          test -n "$token" || { cat "$RUNNER_TEMP/home-secret-access.stderr" >&2 || true; exit 1; }
          echo "::add-mask::$token"
          printf 'REPLICATE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token

      - name: Record irreversible Home attempt marker
        id: home_marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh issue view "$HOME_AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(contains("HOME_CHALLENGER_ATTEMPT_STARTED="))] | length')"
          test "$count" = 0 || { echo "::error::Attempt marker appeared concurrently; refusing provider call."; exit 74; }
          gh issue comment "$HOME_AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "HOME_CHALLENGER_ATTEMPT_STARTED=${GITHUB_RUN_ID}; exact_sha=${GITHUB_SHA}; provider=replicate; model=tencent/hunyuan-3d-3.1; maximum_predictions=1; expected_cost_usd=0.50; automatic_retries=0"
          echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Remove ephemeral Google credential before Home provider call
        env:
          CREDENTIAL_PATH: ${{ steps.home_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CREDENTIAL_PATH"
          case "$CREDENTIAL_PATH" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path; refusing cleanup outside generated WIF file." >&2; exit 1 ;;
          esac
          rm -f -- "$CREDENTIAL_PATH"
          test ! -e "$CREDENTIAL_PATH"

      - name: Execute exactly one Replicate Home challenger
        id: home_run
        shell: bash
        run: |
          set -euo pipefail
          test "$URAI_MODEL_FORGE_SPEND_AUTHORIZED" = 1
          test -n "${REPLICATE_API_TOKEN:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          node model_forge/forge.mjs \
            --spec model_forge/specs/home-architectural-sanctuary.json \
            --providers replicate \
            --out "$RUNNER_TEMP/home-challenger-runs"
          candidate="$(find "$RUNNER_TEMP/home-challenger-runs" -type f -name candidate.glb -print -quit)"
          test -n "$candidate"
          test "$(xxd -p -l 4 "$candidate")" = "676c5446"
          sha="$(sha256sum "$candidate" | awk '{print $1}')"
          bytes="$(stat -c%s "$candidate")"
          echo "candidate_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate_bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Home candidate and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-shot-home-challenger-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/home-challenger-plan.json
            ${{ runner.temp }}/home-challenger-runs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Record Home completion without promotion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA256: ${{ steps.home_run.outputs.candidate_sha256 }}
          CANDIDATE_BYTES: ${{ steps.home_run.outputs.candidate_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$HOME_AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "HOME_CHALLENGER_COMPLETED=${GITHUB_RUN_ID}; candidate_sha256=$CANDIDATE_SHA256; candidate_bytes=$CANDIDATE_BYTES; provider_calls=1; expected_cost_usd=0.50; automatic_retries=0; promoted=false; workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record terminal Home failure after attempt
        if: failure() && steps.home_marker.outputs.attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$HOME_AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "HOME_CHALLENGER_TERMINAL_FAILURE=${GITHUB_RUN_ID}; automatic_retry=false; promoted=false; inspect workflow before any new authorization: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Remove temporary Home provider files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/home-secret-access.stderr"
          rm -f "${{ steps.home_google_auth.outputs.credentials_file_path }}" || true
          printf 'REPLICATE_API_TOKEN=\n' >> "$GITHUB_ENV"

  retain-existing-home-world-authorized-wif:
    name: Retain existing Runway Home outputs
    if: >-
      github.event.issue.number == 326 &&
      github.event.comment.body == 'RETAIN_EXISTING_HOME_RUNWAY_OUTPUTS_NO_SPEND' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: asset-factory-production
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Prove exact no-spend owner authorization event
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test '${{ github.event.issue.number }}' = '326'
          test '${{ github.event.comment.author_association }}' = 'OWNER'
          test '${{ github.event.comment.body }}' = 'RETAIN_EXISTING_HOME_RUNWAY_OUTPUTS_NO_SPEND'
          test "$GITHUB_WORKFLOW_REF" = 'LifeLoggerAI/asset-factory/.github/workflows/replicate-bounded-model3d-smoke.yml@refs/heads/main'

      - name: Checkout exact trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned WIF identity contract
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'

      - name: Authenticate to Google Cloud with trusted WIF
        id: runway_google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup gcloud for canonical Secret Manager read
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Load UrAi Runway credential from Secret Manager without exposing it
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.runway_google_auth.outputs.credentials_file_path }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.runway_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          read_secret() {
            local name="$1"
            local value=""
            local err="$RUNNER_TEMP/$name.stderr"
            set +e
            value="$(gcloud secrets versions access latest --secret="$name" --project="$PROJECT_ID" 2>"$err")"
            local status=$?
            set -e
            if [ "$status" -ne 0 ] || [ -z "$value" ]; then
              classification="other"
              if grep -Eqi 'NOT_FOUND|not found|does not exist' "$err"; then
                classification="not-found"
              elif grep -Eqi 'PERMISSION_DENIED|permission denied|does not have permission|denied on resource' "$err"; then
                classification="permission-denied"
              elif [ "$status" -eq 0 ] && [ -z "$value" ]; then
                classification="empty-value"
              fi
              echo "Protected Secret Manager value $name is unavailable to this exact WIF identity; classification=$classification." >&2
              printf '%s' ""
              return 0
            fi
            printf '%s' "$value"
          }

          runway="$(read_secret RUNWAY_API_KEY)"
          if [ -z "$runway" ]; then
            runway="$(read_secret RUNWAYML_API_SECRET)"
          fi
          if [ -z "$runway" ]; then
            echo "No UrAi Runway credential was readable from the protected Secret Manager boundary." >&2
            exit 1
          fi

          if [[ "$runway" == *$'\n'* || "$runway" == *$'\r'* ]]; then
            echo 'Runway credential must be a single-line value.' >&2
            exit 1
          fi
          echo "::add-mask::$runway"
          printf 'RUNWAY_API_KEY=%s\n' "$runway" >> "$GITHUB_ENV"
          unset runway
      - name: Remove ephemeral Google credential before provider read
        env:
          CREDENTIAL_PATH: ${{ steps.runway_google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CREDENTIAL_PATH"
          case "$CREDENTIAL_PATH" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path; refusing cleanup outside generated WIF file." >&2; exit 1 ;;
          esac
          rm -f -- "$CREDENTIAL_PATH"
          test ! -e "$CREDENTIAL_PATH"

      - name: Verify retention lane cannot generate or mutate provider tasks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '/v1/(image_to_video|text_to_image|text_to_video|video_to_video|recipes/)' scripts/retain-existing-runway-tasks.mjs
          grep -F '/v1/tasks/' scripts/retain-existing-runway-tasks.mjs
          grep -F "method: 'GET'" scripts/retain-existing-runway-tasks.mjs
          grep -F "generationCallsExecuted: 0" scripts/retain-existing-runway-tasks.mjs
          grep -F "providerMutationPerformed: false" scripts/retain-existing-runway-tasks.mjs

      - name: Retain existing task bytes and immutable hashes
        env:
          RUNWAY_API_VERSION: "2024-11-06"
          URAI_RUNWAY_RETENTION_MAX_BYTES: "536870912"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          node scripts/retain-existing-runway-tasks.mjs             model_forge/evidence/home-runway-world001-tasks-20261004.json             "$RUNNER_TEMP/home-runway-world001"

      - name: Verify retained receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const p = process.env.RUNNER_TEMP + '/home-runway-world001/retention-receipt.json'
          const r = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (r.operation !== 'GET_EXISTING_TASK_OUTPUT_ONLY') throw new Error('wrong operation')
          if (r.generationCallsExecuted !== 0) throw new Error('generation call boundary violated')
          if (r.providerMutationPerformed !== false) throw new Error('provider mutation boundary violated')
          if (r.outputUrlsRetained !== false) throw new Error('ephemeral output URL must not be retained')
          if (!Array.isArray(r.items) || r.items.length !== 12) throw new Error('expected 12 retained tasks')
          if (r.items.filter((x) => x.role === 'survey').length !== 8) throw new Error('expected 8 survey videos')
          for (const item of r.items) {
            if (item.taskStatus !== 'SUCCEEDED') throw new Error(item.id + ' not succeeded')
            if (!Array.isArray(item.outputs) || item.outputs.length < 1) throw new Error(item.id + ' has no retained output')
            for (const out of item.outputs) {
              if (!/^[a-f0-9]{64}$/.test(out.sha256)) throw new Error(item.id + ' invalid sha256')
              if (!(out.bytes > 0)) throw new Error(item.id + ' empty output')
            }
          }
          console.log('PASS existing Runway Home outputs retained with hashes; zero generation calls')
          NODE

      - name: Upload private retained Home evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-runway-world001-retained-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/home-runway-world001/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Record successful no-spend retention
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 326 --repo "$GITHUB_REPOSITORY" --body "HOME_RUNWAY_RETENTION_COMPLETED=$GITHUB_RUN_ID; exact_sha=$GITHUB_SHA; existing_tasks=12; survey_videos=8; generation_calls=0; provider_mutation=false; artifact=home-runway-world001-retained-$GITHUB_SHA-$GITHUB_RUN_ID; workflow=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record fail-closed retention result
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 326 --repo "$GITHUB_REPOSITORY" --body "HOME_RUNWAY_RETENTION_FAILED=$GITHUB_RUN_ID; generation_calls=0; provider_mutation=false; inspect protected workflow before retry: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary provider and credential files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/RUNWAY_API_KEY.stderr "$RUNNER_TEMP"/RUNWAYML_API_SECRET.stderr
          rm -f "${{ steps.runway_google_auth.outputs.credentials_file_path }}" || true
          printf 'RUNWAY_API_KEY=\n' >> "$GITHUB_ENV"

  grant-runway-retention-secret-access:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 326 &&
      github.event.comment.body == 'GRANT_RUNWAY_RETENTION_SECRET_ACCESS' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout exact main authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact bounded authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/asset-factory'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          if [ "${{ github.event_name }}" = 'issue_comment' ]; then
            test "${{ github.event.issue.number }}" = '326'
            test "${{ github.event.comment.body }}" = 'GRANT_RUNWAY_RETENTION_SECRET_ACCESS'
            test "${{ github.event.comment.author_association }}" = 'OWNER'
            test "${{ github.actor }}" = "${{ github.repository_owner }}"
          fi
          test "$PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'
          test "$GITHUB_WORKFLOW_REF" = 'LifeLoggerAI/asset-factory/.github/workflows/replicate-bounded-model3d-smoke.yml@refs/heads/main'

      - name: Authenticate exact Asset Factory WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Grant exact resource-scoped Secret Accessor on admitted Runway secret
        id: grant
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for secret in RUNWAY_API_KEY RUNWAYML_API_SECRET; do
            err="$RUNNER_TEMP/${secret}.iam.stderr"
            set +e
            gcloud secrets add-iam-policy-binding "$secret" --project="$PROJECT_ID" --member="serviceAccount:$GCP_DEPLOY_SERVICE_ACCOUNT" --role='roles/secretmanager.secretAccessor' --quiet >/dev/null 2>"$err"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              gcloud secrets versions access latest --secret="$secret" --project="$PROJECT_ID" --quiet >/dev/null
              selected="$secret"
              echo "Verified resource-scoped access for $secret; value not emitted."
              break
            fi
            if grep -Eqi 'NOT_FOUND|not found|does not exist' "$err"; then
              echo "Canonical candidate $secret is not present; trying admitted alternate." >&2
              continue
            fi
            if grep -Eqi 'PERMISSION_DENIED|permission denied|does not have permission|denied on resource' "$err"; then
              echo "Resource IAM mutation is outside current deploy identity for $secret; external cloud-admin grant required." >&2
              exit 63
            fi
            echo "Unable to bind resource IAM for $secret; sanitized classification=other." >&2
            exit 64
          done
          test -n "$selected" || { echo 'Neither admitted canonical Runway secret name exists in the project.' >&2; exit 61; }
          echo "selected_name=$selected" >> "$GITHUB_OUTPUT"
          echo "granted=1" >> "$GITHUB_OUTPUT"

      - name: Post sanitized grant result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_NAME: ${{ steps.grant.outputs.selected_name }}
          GRANTED: ${{ steps.grant.outputs.granted }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 326 --repo "$GITHUB_REPOSITORY" --body "RUNWAY_RETENTION_SECRET_ACCESS_GRANTED=$GITHUB_RUN_ID; exact_main=$GITHUB_SHA; canonical_secret_name=$SELECTED_NAME; resource_scoped_secret_accessor_grants=$GRANTED; secret_values_exposed=false; service_account=$GCP_DEPLOY_SERVICE_ACCOUNT"

      - name: Remove ephemeral Google credential
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/RUNWAY_API_KEY.iam.stderr "$RUNNER_TEMP"/RUNWAYML_API_SECRET.iam.stderr
          rm -f -- "${GOOGLE_APPLICATION_CREDENTIALS:-}" || true
          echo 'GOOGLE_APPLICATION_CREDENTIALS=' >> "$GITHUB_ENV"
          echo 'GOOGLE_GHA_CREDS_PATH=' >> "$GITHUB_ENV"

  readback-asset-factory-custom-domain:
    name: Read back Asset Factory Firebase custom-domain authority
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 55 &&
      github.event.comment.body == 'READBACK_ASSET_FACTORY_CUSTOM_DOMAIN' &&
      github.event.comment.author_association == 'OWNER' &&
