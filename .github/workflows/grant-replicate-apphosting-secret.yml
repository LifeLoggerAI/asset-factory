name: Grant Replicate App Hosting Secret Access

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type GRANT_REPLICATE_APPHOSTING_SECRET_ACCESS
        required: true
        default: CHECK_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: grant-replicate-apphosting-secret
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: urai-4dc1d

jobs:
  grant-access:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'GRANT_REPLICATE_APPHOSTING_SECRET_ACCESS'
    runs-on: ubuntu-latest
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean source and manual authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/asset-factory'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Authenticate to Google Cloud through Workload Identity Federation
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ASSET_FACTORY_ADMIN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify short-lived ADC boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -n "${GOOGLE_GHA_CREDS_PATH:-}"
          test "$GOOGLE_APPLICATION_CREDENTIALS" = "$GOOGLE_GHA_CREDS_PATH"
          case "$GOOGLE_APPLICATION_CREDENTIALS" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo 'Refusing non-action-managed Google credential path' >&2; exit 1 ;;
          esac
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          test ! -L "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install current Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify authenticated project boundary
        shell: bash
        run: |
          set -euo pipefail
          firebase projects:list --json --non-interactive > "$RUNNER_TEMP/firebase-projects.json"
          jq -e --arg project "$EXPECTED_PROJECT_ID" '.result[]? | select(.projectId == $project)' "$RUNNER_TEMP/firebase-projects.json" >/dev/null

      - name: Resolve App Hosting backend URL
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:backends:get assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive \
            --json > "$RUNNER_TEMP/apphosting-backend.json"
          url="$(jq -r '.. | strings | select(test("^https://.*(hosted\\.app|web\\.app)(/)?$"))' "$RUNNER_TEMP/apphosting-backend.json" | head -n 1)"
          test -n "$url"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Grant Replicate secret access to App Hosting
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:grantaccess REPLICATE_API_TOKEN \
            --backend assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Verify secret metadata only
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:describe REPLICATE_API_TOKEN \
            --project "$EXPECTED_PROJECT_ID" \
            --non-interactive

      - name: Create fresh App Hosting rollout
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:rollouts:create assetfactory-studio \
            --git_commit "$GITHUB_SHA" \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Verify live Replicate readiness without API-key disclosure
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o "$RUNNER_TEMP/asset-factory-public-manifest.json" -w '%{http_code}' --max-time 30 "$BACKEND_URL/api/system/manifest" || true)"
            if [ "$code" = '200' ] && jq -e '.capabilities.replicateCredentialVisible == true and .capabilities.replicateModel3dConfigured == true' "$RUNNER_TEMP/asset-factory-public-manifest.json" >/dev/null 2>&1; then
              verified=true
              break
            fi
            echo "Waiting for rollout/Replicate readiness (attempt $attempt/40, HTTP $code)."
            sleep 15
          done
          test "$verified" = true

  report:
    if: always()
    needs: grant-access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post sanitized result to canonical tracker
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.grant-access.result }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(cat <<EOF
          ## Replicate App Hosting verification — automated

          - Exact commit: \`$GITHUB_SHA\`
          - Workflow run: $run_url
          - Result: **$RESULT**
          - Authentication: **short-lived WIF/OIDC only**
          - Secret value exposed: **no**
          - Replicate paid generation triggered by this verification lane: **no**
          EOF
          )
          gh issue comment 63 --repo "$GITHUB_REPOSITORY" --body "$body"
