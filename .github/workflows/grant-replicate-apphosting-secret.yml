name: Grant Replicate App Hosting Secret Access
# Verification trigger: 2026-08-10 final Replicate hookup pass.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grant-replicate-apphosting-secret.yml'

permissions:
  contents: read

concurrency:
  group: grant-replicate-apphosting-secret
  cancel-in-progress: false

jobs:
  grant-access:
    runs-on: ubuntu-latest
    environment: asset-factory-production
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ASSET_FACTORY_API_KEY: ${{ secrets.ASSET_FACTORY_API_KEY }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require protected Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in the protected GitHub environment."
            exit 1
          fi
          if [ -z "$ASSET_FACTORY_API_KEY" ]; then
            echo "ASSET_FACTORY_API_KEY is not configured in the protected GitHub environment."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current Firebase CLI
        run: npm install -g firebase-tools

      - name: Write temporary service account
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Resolve App Hosting backend URL
        id: backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:backends:get assetfactory-studio \
            --project urai-4dc1d \
            --location us-central1 \
            --non-interactive \
            --json > "$RUNNER_TEMP/apphosting-backend.json"
          url="$(jq -r '.. | strings | select(test("^https://.*(hosted\\.app|web\\.app)(/)?$"))' "$RUNNER_TEMP/apphosting-backend.json" | head -n 1)"
          if [ -z "$url" ]; then
            echo "Could not resolve the App Hosting backend URL from Firebase metadata."
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Resolved App Hosting backend URL."

      - name: Grant Replicate secret access to App Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:grantaccess REPLICATE_API_TOKEN \
            --backend assetfactory-studio \
            --project urai-4dc1d \
            --location us-central1 \
            --non-interactive

      - name: Verify secret metadata only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:describe REPLICATE_API_TOKEN \
            --project urai-4dc1d \
            --non-interactive

      - name: Create fresh App Hosting rollout
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:rollouts:create assetfactory-studio \
            --git_commit "$GITHUB_SHA" \
            --project urai-4dc1d \
            --location us-central1 \
            --non-interactive

      - name: Verify live Replicate credential visibility
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o "$RUNNER_TEMP/asset-factory-diagnostics.json" -w '%{http_code}' \
              --max-time 30 \
              -H "x-asset-factory-api-key: $ASSET_FACTORY_API_KEY" \
              "$BACKEND_URL/api/system/manifest?full=true" || true)"
            if [ "$code" = "200" ] && jq -e '.providers.adapters[] | select(.name == "replicate") | .configured == true and (.missingEnv | length == 0)' "$RUNNER_TEMP/asset-factory-diagnostics.json" >/dev/null 2>&1; then
              jq '{service, checkedAt, productionReadiness, replicate: (.providers.adapters[] | select(.name == "replicate") | {name, supportedTypes, configured, missingEnv})}' "$RUNNER_TEMP/asset-factory-diagnostics.json"
              verified=true
              break
            fi
            echo "Waiting for rollout/Replicate runtime visibility (attempt $attempt/40, HTTP $code)."
            sleep 15
          done
          if [ "$verified" != true ]; then
            echo "Live App Hosting diagnostics did not verify Replicate credential visibility."
            if [ -f "$RUNNER_TEMP/asset-factory-diagnostics.json" ]; then
              jq '{error, service, productionReadiness, providers: (.providers.adapters // [] | map({name, configured, missingEnv}))}' "$RUNNER_TEMP/asset-factory-diagnostics.json" 2>/dev/null || true
            fi
            exit 1
          fi

      - name: Remove temporary credentials and diagnostics
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          rm -f "$RUNNER_TEMP/apphosting-backend.json"
          rm -f "$RUNNER_TEMP/asset-factory-diagnostics.json"

  report:
    if: always()
    needs: grant-access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post sanitized result to canonical tracker
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.grant-access.result }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "success" ]; then
            status="PASS — App Hosting secret access, rollout, and live Replicate credential visibility verified."
          else
            status="NOT VERIFIED — protected App Hosting verification lane result: $RESULT. Inspect the workflow run; no provider spend was triggered."
          fi
          body=$(cat <<EOF
          ## Replicate App Hosting verification — automated

          - Exact commit: \`$GITHUB_SHA\`
          - Workflow run: $run_url
          - Result: **$status**
          - Secret value exposed: **no**
          - Replicate paid generation triggered: **no**

          This lane grants only the App Hosting backend read access to \`REPLICATE_API_TOKEN\`, creates a fresh rollout, and checks protected provider diagnostics. It does not set \`ASSET_FACTORY_MEDIA_PROVIDER=replicate\`.
          EOF
          )
          gh issue comment 63 --repo "$GITHUB_REPOSITORY" --body "$body"
