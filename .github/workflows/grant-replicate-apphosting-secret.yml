name: Grant Replicate App Hosting Secret Access
# Verification trigger: WIF-only Replicate hookup pass.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grant-replicate-apphosting-secret.yml'
      - 'assetfactory-studio/app/api/system/manifest/route.ts'
      - 'assetfactory-studio/apphosting.yaml'

permissions:
  contents: read

concurrency:
  group: grant-replicate-apphosting-secret
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: urai-4dc1d
  GCP_WIF_PROVIDER: projects/952723774155/locations/global/workloadIdentityPools/urai-github/providers/asset-factory-github
  GCP_DEPLOY_SERVICE_ACCOUNT: asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com

jobs:
  grant-access:
    runs-on: ubuntu-latest
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/asset-factory'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify pinned WIF identity contract
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PROJECT_ID" = 'urai-4dc1d'
          test "$GCP_WIF_PROVIDER" = 'projects/952723774155/locations/global/workloadIdentityPools/urai-github/providers/asset-factory-github'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com'
          echo 'Pinned non-secret WIF identity contract is present.'

      - name: Authenticate to Google Cloud with WIF
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify authenticated project boundary
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase projects:list --json --non-interactive > "$RUNNER_TEMP/firebase-projects.json"
          jq -e --arg project "$EXPECTED_PROJECT_ID" '.result[]? | select(.projectId == $project)' "$RUNNER_TEMP/firebase-projects.json" >/dev/null

      - name: Resolve App Hosting backend URL
        id: backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:backends:get assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive \
            --json > "$RUNNER_TEMP/apphosting-backend.json"
          url="$(jq -r '.. | strings | select(test("^https://.*(hosted\\.app|web\\.app)(/)?$"))' "$RUNNER_TEMP/apphosting-backend.json" | head -n 1)"
          test -n "$url"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Grant Replicate secret access to App Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:grantaccess REPLICATE_API_TOKEN \
            --backend assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Verify secret metadata only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:describe REPLICATE_API_TOKEN \
            --project "$EXPECTED_PROJECT_ID" \
            --non-interactive

      - name: Create fresh App Hosting rollout
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:rollouts:create assetfactory-studio \
            --git_commit "$GITHUB_SHA" \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Remove ephemeral Google credential
        if: always()
        env:
          CREDENTIAL_PATH: ${{ steps.google_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          if [ -n "${CREDENTIAL_PATH:-}" ]; then
            rm -f -- "$CREDENTIAL_PATH"
            test ! -e "$CREDENTIAL_PATH"
          fi

      - name: Verify live Replicate registry readiness without secret disclosure
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o "$RUNNER_TEMP/asset-factory-public-manifest.json" -w '%{http_code}' --max-time 30 "$BACKEND_URL/api/system/manifest" || true)"
            if [ "$code" = '200' ] && jq -e '.capabilities.replicateCredentialVisible == true and .capabilities.replicateRegistryConfigured == true' "$RUNNER_TEMP/asset-factory-public-manifest.json" >/dev/null 2>&1; then
              jq '{service, checkedAt, capabilities}' "$RUNNER_TEMP/asset-factory-public-manifest.json"
              verified=true
              break
            fi
            echo "Waiting for rollout/Replicate registry readiness (attempt $attempt/40, HTTP $code)."
            sleep 15
          done
          if [ "$verified" != true ]; then
            echo '::error::Live App Hosting diagnostics did not verify the Replicate registry.'
            exit 1
          fi

      - name: Remove diagnostics
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-projects.json"
          rm -f "$RUNNER_TEMP/apphosting-backend.json"
          rm -f "$RUNNER_TEMP/asset-factory-public-manifest.json"

  report:
    if: always()
    needs: grant-access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post sanitized result to canonical tracker
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.grant-access.result }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = 'success' ]; then
            status='PASS — WIF auth, App Hosting secret access, rollout, and Replicate registry readiness verified.'
          else
            status="NOT VERIFIED — protected App Hosting verification lane result: $RESULT. No provider spend was triggered."
          fi
          body=$(cat <<EOF
          ## Replicate App Hosting verification — automated

          - Exact commit: \`$GITHUB_SHA\`
          - Workflow run: $run_url
          - Result: **$status**
          - Authentication: **short-lived WIF/OIDC only**
          - WIF provider: \`$GCP_WIF_PROVIDER\`
          - Deploy service account: \`$GCP_DEPLOY_SERVICE_ACCOUNT\`
          - Long-lived JSON-key fallback: **disabled**
          - Secret value exposed: **no**
          - Replicate paid generation triggered by this verification lane: **no**

          This lane grants the App Hosting backend read access to \`REPLICATE_API_TOKEN\`, creates a fresh rollout, and checks sanitized registry readiness. It does not set \`ASSET_FACTORY_MEDIA_PROVIDER=replicate\` and it cannot trigger the paid model3d smoke automatically.
          EOF
          )
          gh issue comment 63 --repo "$GITHUB_REPOSITORY" --body "$body"
