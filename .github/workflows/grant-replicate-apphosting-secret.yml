name: Grant Replicate App Hosting Secret Access
# Verification trigger: WIF-first Replicate hookup pass.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grant-replicate-apphosting-secret.yml'
      - 'assetfactory-studio/app/api/system/manifest/route.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: grant-replicate-apphosting-secret
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: urai-4dc1d
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ vars.GCP_ASSET_FACTORY_ADMIN_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_MAPS_ADMIN_SERVICE_ACCOUNT }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  grant-access:
    runs-on: ubuntu-latest
    environment: asset-factory-production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/asset-factory'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Select protected Google authentication mode
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo 'mode=wif' >> "$GITHUB_OUTPUT"
            echo 'Using short-lived GitHub OIDC / Google Workload Identity Federation.'
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'mode=json' >> "$GITHUB_OUTPUT"
            echo 'Using protected Firebase service-account JSON fallback.'
          else
            echo '::error::No protected Google Cloud identity is configured for Asset Factory. Configure WIF (preferred) or a rotated least-privilege FIREBASE_SERVICE_ACCOUNT secret.'
            exit 1
          fi

      - name: Authenticate to Google Cloud through Workload Identity Federation
        if: steps.auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Write temporary service account fallback
        if: steps.auth.outputs.mode == 'json'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install current Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify authenticated project boundary
        shell: bash
        run: |
          set -euo pipefail
          firebase projects:list --json --non-interactive > "$RUNNER_TEMP/firebase-projects.json"
          jq -e --arg project "$EXPECTED_PROJECT_ID" '.result[]? | select(.projectId == $project)' "$RUNNER_TEMP/firebase-projects.json" >/dev/null
          echo 'Authenticated Google identity can see the expected Firebase project.'

      - name: Resolve App Hosting backend URL
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:backends:get assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive \
            --json > "$RUNNER_TEMP/apphosting-backend.json"
          url="$(jq -r '.. | strings | select(test("^https://.*(hosted\\.app|web\\.app)(/)?$"))' "$RUNNER_TEMP/apphosting-backend.json" | head -n 1)"
          if [ -z "$url" ]; then
            echo '::error::Could not resolve the App Hosting backend URL from Firebase metadata.'
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo 'Resolved App Hosting backend URL.'

      - name: Grant Replicate secret access to App Hosting
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:grantaccess REPLICATE_API_TOKEN \
            --backend assetfactory-studio \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Verify secret metadata only
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:describe REPLICATE_API_TOKEN \
            --project "$EXPECTED_PROJECT_ID" \
            --non-interactive

      - name: Create fresh App Hosting rollout
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:rollouts:create assetfactory-studio \
            --git_commit "$GITHUB_SHA" \
            --project "$EXPECTED_PROJECT_ID" \
            --location us-central1 \
            --non-interactive

      - name: Verify live Replicate readiness without API-key disclosure
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o "$RUNNER_TEMP/asset-factory-public-manifest.json" -w '%{http_code}' \
              --max-time 30 \
              "$BACKEND_URL/api/system/manifest" || true)"
            if [ "$code" = '200' ] && jq -e '.capabilities.replicateCredentialVisible == true and .capabilities.replicateModel3dConfigured == true' "$RUNNER_TEMP/asset-factory-public-manifest.json" >/dev/null 2>&1; then
              jq '{service, checkedAt, replicateCredentialVisible: .capabilities.replicateCredentialVisible, replicateModel3dConfigured: .capabilities.replicateModel3dConfigured}' "$RUNNER_TEMP/asset-factory-public-manifest.json"
              verified=true
              break
            fi
            echo "Waiting for rollout/Replicate readiness (attempt $attempt/40, HTTP $code)."
            sleep 15
          done
          if [ "$verified" != true ]; then
            echo '::error::Live App Hosting public diagnostics did not verify Replicate credential/model readiness.'
            if [ -f "$RUNNER_TEMP/asset-factory-public-manifest.json" ]; then
              jq '{service, checkedAt, capabilities: {replicateCredentialVisible: .capabilities.replicateCredentialVisible, replicateModel3dConfigured: .capabilities.replicateModel3dConfigured}}' "$RUNNER_TEMP/asset-factory-public-manifest.json" 2>/dev/null || true
            fi
            exit 1
          fi

      - name: Remove temporary credentials and diagnostics
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          rm -f "$RUNNER_TEMP/firebase-projects.json"
          rm -f "$RUNNER_TEMP/apphosting-backend.json"
          rm -f "$RUNNER_TEMP/asset-factory-public-manifest.json"

  report:
    if: always()
    needs: grant-access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post sanitized result to canonical tracker
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.grant-access.result }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = 'success' ]; then
            status='PASS — App Hosting secret access, rollout, and live Replicate credential/model readiness verified.'
          else
            status="NOT VERIFIED — protected App Hosting verification lane result: $RESULT. Inspect the workflow run; no provider spend was triggered."
          fi
          body=$(cat <<EOF
          ## Replicate App Hosting verification — automated

          - Exact commit: \`$GITHUB_SHA\`
          - Workflow run: $run_url
          - Result: **$status**
          - Authentication preference: **short-lived WIF/OIDC first; rotated JSON fallback only**
          - Secret value exposed: **no**
          - Replicate paid generation triggered by this verification lane: **no**

          This lane grants only the App Hosting backend read access to \`REPLICATE_API_TOKEN\`, creates a fresh rollout, and checks sanitized public readiness booleans. It does not set \`ASSET_FACTORY_MEDIA_PROVIDER=replicate\`.
          EOF
          )
          gh issue comment 63 --repo "$GITHUB_REPOSITORY" --body "$body"
