name: Grant Replicate App Hosting Secret Access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grant-replicate-apphosting-secret.yml'

permissions:
  contents: read

concurrency:
  group: grant-replicate-apphosting-secret
  cancel-in-progress: false

jobs:
  grant-access:
    runs-on: ubuntu-latest
    environment: asset-factory-production
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require protected Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in the protected GitHub environment."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current Firebase CLI
        run: npm install -g firebase-tools

      - name: Write temporary service account
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Verify App Hosting backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:backends:get assetfactory-studio \
            --project urai-4dc1d \
            --location us-central1 \
            --non-interactive

      - name: Grant Replicate secret access to App Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:grantaccess REPLICATE_API_TOKEN \
            --backend assetfactory-studio \
            --project urai-4dc1d \
            --location us-central1 \
            --non-interactive

      - name: Verify secret metadata only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          firebase apphosting:secrets:describe REPLICATE_API_TOKEN \
            --project urai-4dc1d \
            --non-interactive

      - name: Remove temporary service account
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
