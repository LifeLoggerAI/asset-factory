name: One-Time Promote Recovered Exact V2-V5 Assets

on:
  workflow_run:
    workflows: [One-Time V4 Exact Five Recovery]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-promote-recovered-v2-v5-assets-20260730
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == '8a1d42fe026219673c6ac4501ed13a1feaa99849'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: paid-asset-generation
    env:
      ORIGINAL_RUN_ID: '30543824770'
      RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
      SPATIAL_REPOSITORY: LifeLoggerAI/urai-spatial
      CERTIFIER_BRANCH: certify/v2-runtime-estate-20260729
      GH_TOKEN: ${{ secrets.URAI_WHEEL_GITHUB_TOKEN }}
    steps:
      - name: Prove exact recovery authority and promotion credential
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.workflow_run.name }}' = 'One-Time V4 Exact Five Recovery'
          test '${{ github.event.workflow_run.conclusion }}' = 'success'
          test '${{ github.event.workflow_run.head_sha }}' = '8a1d42fe026219673c6ac4501ed13a1feaa99849'
          test -n "$GH_TOKEN"

      - name: Download exact V2 V3 V5 and recovered V4 artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/promotion"
          mkdir -p "$root"
          download_artifact() {
            repo="$1"; artifact_id="$2"; version="$3"
            mkdir -p "$root/$version"
            gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > "$root/$version.zip"
            unzip -q "$root/$version.zip" -d "$root/$version"
          }
          download_artifact LifeLoggerAI/asset-factory 8763143473 v2
          download_artifact LifeLoggerAI/asset-factory 8760845553 v3
          download_artifact LifeLoggerAI/asset-factory 8761664025 v5
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/artifacts?per_page=100" > "$root/recovery-artifacts.json"
          recovery_id="$(python - "$root/recovery-artifacts.json" "$RECOVERY_RUN_ID" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1])); run=sys.argv[2]
          name=f'urai-v4-exact-five-recovery-{run}'
          matches=[a for a in payload.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          assert len(matches)==1,(name,matches)
          print(matches[0]['id'])
          PY
          )"
          download_artifact LifeLoggerAI/asset-factory "$recovery_id" v4
          echo "PROMOTION_ROOT=$root" >> "$GITHUB_ENV"
          echo "RECOVERY_ARTIFACT_ID=$recovery_id" >> "$GITHUB_ENV"

      - name: Validate complete 151-asset evidence set
        shell: bash
        run: |
          set -euo pipefail
          python - "$PROMOTION_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); expected={'v2':71,'v3':14,'v4':39,'v5':27}
          total_calls=0; total_cost=0.0; summary={'schemaVersion':'1.0.0','originalRunId':30543824770,'recoveryRunId':int(__import__('os').environ['RECOVERY_RUN_ID']),'versions':{},'promotionAuthorized':True,'deploymentAuthorized':False}
          for version,count in expected.items():
              receipts=list((root/version).rglob(f'{version}-generation-receipt.json'))
              assert len(receipts)==1,(version,receipts)
              receipt=receipts[0]; payload=json.loads(receipt.read_text())
              claimed=payload.pop('receiptSha256'); raw=(json.dumps(payload,indent=2,sort_keys=True)+'\n').encode(); assert hashlib.sha256(raw).hexdigest()==claimed,version
              assert payload['status']=='passed' and payload['generated']==count and payload['passed']==count and payload['failed']==0,payload
              assert payload['failedNames']==[] and payload['exactDuplicateGroups']==[],payload
              runtime=receipt.parent/'runtime'; files=sorted(runtime.rglob('*.webp')); assert len(files)==count,(version,len(files))
              for record in payload['assets']:
                  assert record['status']=='passed',record
                  path=receipt.parent/record['runtimeFile']; assert path.is_file(),path
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==record['technical']['sha256'],record['name']
              if version=='v4':
                  assert payload['retainedPassed']==34 and len(payload['retriedNames'])==5,payload
                  calls=int(payload['providerCallsExecutedCumulativeV4']); cost=float(payload['reservedEstimatedCostUsdCumulativeV4'])
              else:
                  calls=int(payload['providerCallsExecuted']); cost=float(payload['reservedEstimatedCostUsd'])
              total_calls+=calls; total_cost+=cost
              summary['versions'][version]={'generated':count,'passed':count,'failed':0,'providerCallsExecuted':calls,'reservedEstimatedCostUsd':f'{cost:.2f}','receiptSha256':claimed}
          assert total_calls<=166,total_calls
          assert total_cost<=166.0,total_cost
          summary['totalGenerated']=151; summary['totalPassed']=151; summary['totalFailed']=0; summary['totalProviderCallsExecuted']=total_calls; summary['totalReservedEstimatedCostUsd']=f'{total_cost:.2f}'
          (root/'promotion-source-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Checkout exact Spatial certification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LifeLoggerAI/urai-spatial
          ref: ${{ env.CERTIFIER_BRANCH }}
          token: ${{ secrets.URAI_WHEEL_GITHUB_TOKEN }}
          path: spatial
          fetch-depth: 0

      - name: Install exact runtime assets and publish promotion branch
        id: publish
        working-directory: spatial
        shell: bash
        run: |
          set -euo pipefail
          certifier_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git merge-base --is-ancestor "$main_sha" "$certifier_sha"
          test -z "$(git status --porcelain --untracked-files=all)"
          for version in v2 v3 v4 v5; do
            receipt="$(find "$PROMOTION_ROOT/$version" -name "$version-generation-receipt.json" -print -quit)"
            runtime="$(dirname "$receipt")/runtime"
            rsync -a "$runtime/" urai-tier1/public/
          done
          mkdir -p docs/release-evidence
          cp "$PROMOTION_ROOT/promotion-source-receipt.json" docs/release-evidence/URAI-SPATIAL-20260730-V2-V5-EXACT-PAID-PROMOTION.json
          branch="asset-factory/v2-v5-exact-paid-${RECOVERY_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'URAI Production Wheel'
          git config user.email 'urai-wheel@users.noreply.github.com'
          git add urai-tier1/public/assets/urai/v2 urai-tier1/public/assets/urai/v3 urai-tier1/public/assets/urai/v4 urai-tier1/public/assets/urai/v5 docs/release-evidence/URAI-SPATIAL-20260730-V2-V5-EXACT-PAID-PROMOTION.json
          git diff --cached --quiet && { echo 'No promotion changes found' >&2; exit 1; }
          git commit -m 'Promote exact provider-backed V2-V5 assets'
          head_sha="$(git rev-parse HEAD)"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "certifier_sha=$certifier_sha" >> "$GITHUB_OUTPUT"

      - name: Run focused asset certification before PR
        working-directory: spatial
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow imagehash
          python scripts/test-certify-v2-runtime-assets.py
          python scripts/certify-v2-runtime-assets.py
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 assets:validate
          pnpm --dir urai-tier1 receipt:assets

      - name: Open Spatial promotion pull request
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          MAIN_SHA: ${{ steps.publish.outputs.main_sha }}
          CERTIFIER_SHA: ${{ steps.publish.outputs.certifier_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${SPATIAL_REPOSITORY}/pulls?state=open&head=LifeLoggerAI:${BRANCH}" --jq '.[0].number // empty')"
          test -z "$existing" || { echo "PR already exists: $existing"; exit 0; }
          body="$(cat <<EOF
          Promotes the complete evidence-authorized provider-backed V2-V5 runtime estate.

          - V2: 71 replacements; nine existing technical passes preserved
          - V3: 14 generated
          - V4: 34 retained passes plus five exact missing-only repairs
          - V5: 27 generated
          - Total: 151 generated targets, 151 passed, zero failed

          Original generation run: \`30543824770\`
          V4 recovery run: \`${RECOVERY_RUN_ID}\`
          Spatial main at branch creation: \`${MAIN_SHA}\`
          Corrected V2 certifier base: \`${CERTIFIER_SHA}\`
          Promotion head: \`${HEAD_SHA}\`

          This PR includes the corrected V2 certification changes and supersedes proof-only PR #978 after successful merge. Deployment remains separate and protected.
          EOF
          )"
          gh api "repos/${SPATIAL_REPOSITORY}/pulls" -X POST -f title='Promote exact provider-backed V2-V5 assets' -f head="$BRANCH" -f base=main -f body="$body"
