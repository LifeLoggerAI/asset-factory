name: Repair governed Asset Factory dependency locks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: converge/asset-factory-production-multimodal-20260925
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Regenerate governed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          npm --prefix life-map-pipeline/functions install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix engine install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify generated lock roots match active manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs')
          const fnPkg=require('./life-map-pipeline/functions/package.json')
          const fnLock=require('./life-map-pipeline/functions/package-lock.json')
          const enginePkg=require('./engine/package.json')
          const engineLock=require('./engine/npm-shrinkwrap.json')
          const fnRoot=fnLock.packages?.[''] ?? {}
          const engineRoot=engineLock.packages?.[''] ?? {}
          const stable=(value)=>Object.fromEntries(Object.entries(value ?? {}).sort(([a],[b])=>a.localeCompare(b)))
          const assertMap=(label,actual,expected)=>{
            const a=JSON.stringify(stable(actual))
            const e=JSON.stringify(stable(expected))
            if(a!==e){
              console.error(label,'actual=',a)
              console.error(label,'expected=',e)
              throw new Error(`${label} do not match`)
            }
          }
          assertMap('Functions package-lock root dependencies',fnRoot.dependencies,fnPkg.dependencies)
          if (JSON.stringify(stable(fnRoot.overrides ?? {})) !== JSON.stringify(stable(fnPkg.overrides ?? {}))) {
            // npm lock v3 may not serialize overrides in the root package object; dependency identity below remains authoritative.
            console.log('Functions lock root does not serialize overrides; continuing with resolved lock verification.')
          }
          assertMap('Engine shrinkwrap root dependencies',engineRoot.dependencies,enginePkg.dependencies)
          console.log('PASS active lock roots match package manifests')
          NODE

      - name: Commit exact generated locks if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml life-map-pipeline/functions/package-lock.json engine/npm-shrinkwrap.json; then
            echo "All governed dependency locks already match their manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml life-map-pipeline/functions/package-lock.json engine/npm-shrinkwrap.json
          git commit -m "security: regenerate governed dependency locks"
          git push origin HEAD:converge/asset-factory-production-multimodal-20260925
