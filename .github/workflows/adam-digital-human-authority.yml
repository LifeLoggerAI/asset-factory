name: Adam Digital Human Authority

on:
  push:
    branches:
      - agent/parallel-founder-digital-human-20260926
  pull_request:
    paths:
      - 'model_forge/founder_digital_human/**'
      - 'docs/contracts/ADAM_DIGITAL_HUMAN_V1.md'
      - 'scripts/test-adam-digital-human-authority.mjs'
      - 'package.json'
      - '.github/workflows/adam-digital-human-authority.yml'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:adam-digital-human-authority
