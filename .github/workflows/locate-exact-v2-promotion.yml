name: Locate Exact V2 Promotion Run

on:
  push:
    branches: [main]
    paths:
      - authorizations/locate-exact-v2-promotion-20260731.json

permissions:
  actions: read
  contents: write

concurrency:
  group: locate-exact-v2-promotion-20260731
  cancel-in-progress: false

jobs:
  locate:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_WORKFLOW: one-time-promote-exact-v2-assets.yml
      TARGET_HEAD_SHA: 0df443a66b33c36915bd9902c675eeed84b013eb
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact locator marker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Find and await the exact promotion run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v2-promotion-locator docs/release-evidence
          for attempt in $(seq 1 100); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=push&head_sha=${TARGET_HEAD_SHA}&per_page=10" > artifacts/v2-promotion-locator/runs.json
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.TARGET_HEAD_SHA)] | length' artifacts/v2-promotion-locator/runs.json)"
            if [ "$count" = '1' ]; then
              status="$(jq -r '.workflow_runs[] | select(.head_sha == env.TARGET_HEAD_SHA) | .status' artifacts/v2-promotion-locator/runs.json)"
              if [ "$status" = 'completed' ]; then
                break
              fi
            elif [ "$count" != '0' ]; then
              echo "Expected one exact promotion run, found $count" >&2
              exit 1
            fi
            sleep 30
          done
          run_id="$(jq -r '.workflow_runs[] | select(.head_sha == env.TARGET_HEAD_SHA) | .id // empty' artifacts/v2-promotion-locator/runs.json)"
          test -n "$run_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > artifacts/v2-promotion-locator/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > artifacts/v2-promotion-locator/jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > artifacts/v2-promotion-locator/artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('artifacts/v2-promotion-locator/run.json').read_text())
          jobs=json.loads(Path('artifacts/v2-promotion-locator/jobs.json').read_text()).get('jobs',[])
          artifacts=json.loads(Path('artifacts/v2-promotion-locator/artifacts.json').read_text()).get('artifacts',[])
          assert run['head_sha']=='0df443a66b33c36915bd9902c675eeed84b013eb',run
          assert run['event']=='push',run
          assert run['status']=='completed',run
          receipt={
            'schemaVersion':'1.0.0',
            'programAuthority':'LifeLoggerAI/asset-factory#206',
            'workflow':'One-Time Promote Exact V2 Assets',
            'workflowFile':'one-time-promote-exact-v2-assets.yml',
            'headSha':run['head_sha'],
            'runId':run['id'],
            'runAttempt':run['run_attempt'],
            'status':run['status'],
            'conclusion':run['conclusion'],
            'htmlUrl':run['html_url'],
            'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'htmlUrl':j['html_url']} for j in jobs],
            'artifacts':[{'id':a['id'],'name':a['name'],'sizeInBytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts],
            'providerCallsExecutedByLocator':0,
            'spendUsdByLocator':'0.00',
            'promotionAuthorized':True,
            'deploymentAuthorized':False,
          }
          Path('docs/release-evidence/URAI-AF-20260731-V2-EXACT-PROMOTION-RUN.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          if run['conclusion']!='success':
            raise SystemExit(f"promotion run did not succeed: {run['conclusion']}")
          PY

      - name: Commit exact promotion run receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release-evidence/URAI-AF-20260731-V2-EXACT-PROMOTION-RUN.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence: record exact V2 promotion run'
          git push origin HEAD:main

      - name: Upload locator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-exact-promotion-locator-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/v2-promotion-locator/**
            docs/release-evidence/URAI-AF-20260731-V2-EXACT-PROMOTION-RUN.json
