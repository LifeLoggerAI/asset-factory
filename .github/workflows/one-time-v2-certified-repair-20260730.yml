name: V2 Certified Failed-Only Repair Validation

on:
  push:
    branches: [repair/v2-certified-gaps-20260730]
    paths:
      - authorizations/execute-v2-certified-repair-20260730.json
      - manifests/v2-certified-repair-manifest-20260730.json.gz.b64
      - scripts/generate_v2_certified_replacements.py
      - .github/workflows/one-time-v2-certified-repair-20260730.yml
  pull_request:
    branches: [main]
    paths:
      - authorizations/execute-v2-certified-repair-20260730.json
      - manifests/v2-certified-repair-manifest-20260730.json.gz.b64
      - scripts/generate_v2_certified_replacements.py
      - .github/workflows/one-time-v2-certified-repair-20260730.yml

permissions:
  contents: read

concurrency:
  group: v2-certified-repair-validation-20260730-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore exact certified repair manifest
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64').read_text().strip()
          decoded = gzip.decompress(base64.b64decode(encoded))
          Path('manifests/v2-certified-repair-manifest-20260730.json').write_bytes(decoded)
          PY
      - name: Validate failed-only authority and activation boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          auth_path = Path('authorizations/execute-v2-certified-repair-20260730.json')
          manifest_path = Path('manifests/v2-certified-repair-manifest-20260730.json')
          generator_path = Path('scripts/generate_v2_certified_replacements.py')
          activation_path = Path('authorizations/activate-v2-certified-repair-20260730.json')

          authority = json.loads(auth_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          execution = authority['execution']
          replacements = manifest['replacements']
          preserved = manifest['preserve']

          assert authority['programAuthority'] == 'LifeLoggerAI/asset-factory#206'
          assert execution['replacementAssets'] == 71
          assert execution['preservedAssets'] == 9
          assert execution['maxAttemptsPerAsset'] == 2
          assert execution['maxProviderCalls'] == 142
          assert execution['maxSpendUsd'] == '20.00'
          assert execution['missingOrFailedOnly'] is True
          assert execution['promotionAuthorized'] is False
          assert execution['deploymentAuthorized'] is False
          assert execution['activationRequired'] is True
          assert execution['activationMarker'] == str(activation_path)
          assert not activation_path.exists(), 'paid activation marker must not be present in the preparation PR'

          assert len(replacements) == 71
          assert len(preserved) == 9
          assert all(item['status'] == 'authorized-replacement' for item in replacements)
          assert len({item['name'] for item in replacements}) == 71
          assert len({item['canonicalPath'] for item in replacements}) == 71
          assert len({item['name'] for item in preserved}) == 9
          assert not ({item['name'] for item in replacements} & {item['name'] for item in preserved})
          assert all(item['model'] == 'gpt-image-2' for item in replacements)
          assert all(item['quality'] == 'medium' for item in replacements)
          assert all(int(item['maxAttempts']) <= 2 for item in replacements)

          hashes = {
              'authorizationSha256': hashlib.sha256(auth_path.read_bytes()).hexdigest(),
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'generatorSha256': hashlib.sha256(generator_path.read_bytes()).hexdigest(),
          }
          Path('artifacts/v2-certified-repair-validation').mkdir(parents=True, exist_ok=True)
          Path('artifacts/v2-certified-repair-validation/receipt.json').write_text(json.dumps({
              'status': 'passed',
              'programAuthority': authority['programAuthority'],
              'replacementAssets': 71,
              'preservedAssets': 9,
              'providerCalls': 0,
              'spendUsd': '0.00',
              'activationRequired': True,
              **hashes,
          }, indent=2, sort_keys=True) + '\n')
          print('V2_FAILED_ONLY_PREPARATION_VALID')
          PY
      - name: Compile generator without provider access
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_v2_certified_replacements.py
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"
      - name: Upload no-spend validation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-certified-repair-validation-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/v2-certified-repair-validation/receipt.json
