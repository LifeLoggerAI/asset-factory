name: One-Time V2 Certified Failed-Only Repair

on:
  workflow_dispatch:
  push:
    branches: [repair/v2-certified-gaps-20260730]
    paths:
      - authorizations/execute-v2-certified-repair-20260730.json
      - manifests/v2-certified-repair-manifest-20260730.json.gz.b64
      - scripts/generate_v2_certified_replacements.py
      - .github/workflows/one-time-v2-certified-repair-20260730.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-v2-certified-repair-20260730
  cancel-in-progress: false

jobs:
  authorize:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      safe: ${{ steps.check.outputs.safe }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: check
        name: Validate exact failed-only authorization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          encoded=Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64').read_text().strip()
          Path('manifests/v2-certified-repair-manifest-20260730.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          a=json.load(open('authorizations/execute-v2-certified-repair-20260730.json'))
          m=json.load(open('manifests/v2-certified-repair-manifest-20260730.json'))
          assert a['programAuthority']=='LifeLoggerAI/asset-factory#206'
          assert a['execution']['replacementAssets']==71
          assert a['execution']['preservedAssets']==9
          assert a['execution']['maxProviderCalls']==142
          assert a['execution']['maxSpendUsd']=='20.00'
          assert a['execution']['promotionAuthorized'] is False
          assert a['execution']['deploymentAuthorized'] is False
          assert len(m['replacements'])==71
          assert len(m['preserve'])==9
          assert all(x['status']=='authorized-replacement' for x in m['replacements'])
          print('V2_FAILED_ONLY_AUTHORITY_OK')
          PY
          echo 'safe=true' >> "$GITHUB_OUTPUT"

  generate:
    needs: authorize
    if: needs.authorize.outputs.safe == 'true'
    environment: paid-asset-generation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore exact certified repair manifest
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded=Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64').read_text().strip()
          Path('manifests/v2-certified-repair-manifest-20260730.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Verify provider boundary
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Install deterministic image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Generate and validate 71 failed V2 assets
        run: python scripts/generate_v2_certified_replacements.py
      - name: Upload complete V2 repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-certified-failed-only-repair-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: artifacts/v2-certified-repair/**
