name: V1 AAA Spatial Pack Integrity

on:
  pull_request:
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/v1-aaa-spatial-pack-integrity.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - image_asset_generator/recover_v1_receptionist.py
      - image_asset_generator/score_v1_assets.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/v1-aaa-spatial-pack-integrity.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - image_asset_generator/recover_v1_receptionist.py
      - image_asset_generator/score_v1_assets.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Compile recovery executor and authorization validators
        run: |
          python3 -m py_compile \
            image_asset_generator/recover_v1_receptionist.py \
            image_asset_generator/score_v1_assets.py \
            scripts/validate_v1_receptionist_recovery_marker.py \
            scripts/validate_v1_receptionist_recovery_commit.py
      - name: Verify exact one-asset paid boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          marker=Path('scripts/validate_v1_receptionist_recovery_marker.py').read_text()
          executor=Path('image_asset_generator/recover_v1_receptionist.py').read_text()
          required_workflow=[
            'name: One-Time V1 Receptionist Missing-Only Recovery',
            'authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json',
            'environment: paid-asset-generation',
            "ASSET_FORGE_MAX_PROVIDER_CALLS: '1'",
            "ASSET_FORGE_MAX_UNIT_COST_USD: '1.00'",
            "ASSET_FORGE_MAX_COST_USD: '1.00'",
            "ASSET_RENDERER_MAX_ATTEMPTS: '1'",
            'retainedArtifactId',
            '8741010314',
            'avatar_receptionist',
            'recover_v1_receptionist.py',
          ]
          for value in required_workflow:
              assert value in workflow, value
          secret_expr = '$' + '{{ secrets.'
          assert workflow.count('OPENAI_API_KEY: ' + secret_expr + 'OPENAI_API_KEY }}') == 1
          for forbidden in ('git push', 'merge_pull_request', 'enable_auto_merge', 'repository: LifeLoggerAI/urai-spatial', 'firebase deploy'):
              assert forbidden not in workflow, forbidden
          for value in (
            "'maxNewProviderCalls': 1",
            "'maxUnitCostUsd': '1.00'",
            "'maxTotalCostUsd': '1.00'",
            "'targetAsset': TARGET",
            "RETAINED_ARTIFACT_ID = 8741010314",
            "'promote': False",
          ):
              assert value in marker, value
          for value in (
            "TARGET = 'avatar_receptionist'",
            'RETAINED_ACCEPTED = 52',
            "if generation.get('outputRequests') != 1",
            "if ledger.get('providerCallsExecuted') != 1",
            'assert_accepted_unchanged',
            "base_receipt['missing'] = 0",
          ):
              assert value in executor, value
          PY
      - name: Verify marker schema fails closed
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          PYTHONPATH=scripts python3 - "$tmp" <<'PY'
          import json, sys
          from pathlib import Path
          from validate_v1_receptionist_recovery_marker import expected_marker, validate_marker
          parent='a'*40
          path=Path(sys.argv[1])/'execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json'
          path.write_text(json.dumps(expected_marker(parent)))
          assert validate_marker(path, parent)['maxNewProviderCalls'] == 1
          payload=json.loads(path.read_text())
          payload['maxNewProviderCalls']=2
          path.write_text(json.dumps(payload))
          try:
              validate_marker(path, parent)
          except ValueError:
              pass
          else:
              raise AssertionError('expanded call ceiling must fail closed')
          PY
      - name: Verify current paid workflow boundary
        run: npm run check:paid-workflow-boundary
