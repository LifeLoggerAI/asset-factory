name: Direct WIF Read-Only Probe

on:
  push:
    branches:
      - agent/direct-wif-probe
    paths:
      - .github/workflows/direct-wif-readonly-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: asset-factory-production
    timeout-minutes: 15
    env:
      PROJECT_ID: urai-4dc1d
      WIF_PROVIDER: projects/952723774155/locations/global/workloadIdentityPools/urai-github/providers/asset-factory-github
      DEPLOY_SERVICE_ACCOUNT: asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate directly through documented WIF resource
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read-only verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$PROJECT_ID"
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test "$active_account" = "$DEPLOY_SERVICE_ACCOUNT"
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$project_number" = '952723774155'
          gcloud iam workload-identity-pools providers describe asset-factory-github \
            --project="$PROJECT_ID" \
            --location=global \
            --workload-identity-pool=urai-github \
            --format='value(state)'
          gcloud secrets describe REPLICATE_API_TOKEN \
            --project="$PROJECT_ID" \
            --format='value(name)'
          {
            echo '### Direct Asset Factory WIF probe'
            echo "- Project: ${PROJECT_ID}"
            echo "- Project number: ${project_number}"
            echo "- Active account: ${active_account}"
            echo '- Cloud mutation performed: no'
            echo '- Replicate provider call performed: no'
          } >> "$GITHUB_STEP_SUMMARY"
