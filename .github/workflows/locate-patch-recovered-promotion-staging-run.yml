name: Locate Recovered Promotion Staging Patch Run

on:
  push:
    branches: [main]
    paths:
      - authorizations/locate-patch-recovered-promotion-staging-run-20260731.json

permissions:
  actions: read
  contents: write

concurrency:
  group: locate-patch-recovered-promotion-staging-run-20260731
  cancel-in-progress: false

jobs:
  locate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_WORKFLOW: patch-recovered-promotion-staging.yml
      TARGET_HEAD_SHA: be46758a379f6e214f82e331af930ebd1db52a0e
      RECEIPT_PATH: docs/release-evidence/URAI-AF-20260731-PROMOTION-STAGING-PATCH-RUN.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Locate exact patch run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/promotion-staging-patch-locator docs/release-evidence
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=push&per_page=20" > artifacts/promotion-staging-patch-locator/runs.json
            count="$(python - <<'PY'
          import json,os
          payload=json.load(open('artifacts/promotion-staging-patch-locator/runs.json'))
          runs=[r for r in payload.get('workflow_runs',[]) if r.get('head_sha')==os.environ['TARGET_HEAD_SHA'] and r.get('event')=='push']
          print(len(runs))
          PY
          )"
            if [ "$count" = 1 ]; then break; fi
            if [ "$count" -gt 1 ]; then echo "Expected one patch run, found $count" >&2; exit 1; fi
            sleep 10
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload=json.load(open('artifacts/promotion-staging-patch-locator/runs.json'))
          runs=[r for r in payload.get('workflow_runs',[]) if r.get('head_sha')==os.environ['TARGET_HEAD_SHA'] and r.get('event')=='push']
          assert len(runs)==1,runs
          run=runs[0]
          Path('artifacts/promotion-staging-patch-locator/run-id.txt').write_text(str(run['id']))
          PY
          run_id="$(cat artifacts/promotion-staging-patch-locator/run-id.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > artifacts/promotion-staging-patch-locator/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > artifacts/promotion-staging-patch-locator/jobs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path('artifacts/promotion-staging-patch-locator/run.json').read_text())
          jobs=json.loads(Path('artifacts/promotion-staging-patch-locator/jobs.json').read_text()).get('jobs',[])
          receipt={
            'schemaVersion':'1.0.0',
            'programAuthority':'LifeLoggerAI/asset-factory#206',
            'workflow':'Patch Recovered Promotion Staging',
            'workflowFile':os.environ['TARGET_WORKFLOW'],
            'targetHeadSha':os.environ['TARGET_HEAD_SHA'],
            'runId':run['id'],
            'runAttempt':run['run_attempt'],
            'event':run['event'],
            'status':run['status'],
            'conclusion':run['conclusion'],
            'createdAt':run['created_at'],
            'updatedAt':run['updated_at'],
            'htmlUrl':run['html_url'],
            'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'htmlUrl':j['html_url']} for j in jobs],
            'providerCallsExecutedByLocator':0,
            'spendUsdByLocator':'0.00',
            'deploymentAuthorized':False,
          }
          Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit patch locator receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RECEIPT_PATH"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence: locate promotion staging patch run'
          git push origin HEAD:main

      - name: Upload locator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-staging-patch-locator-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/promotion-staging-patch-locator/**
            docs/release-evidence/URAI-AF-20260731-PROMOTION-STAGING-PATCH-RUN.json
