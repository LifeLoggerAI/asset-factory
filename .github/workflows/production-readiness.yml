name: Asset Factory Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/asset-forge-triggers/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Request production deployment evaluation. Deployment remains fail-closed until a dedicated Asset Factory target is provider-proven.'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'Type DEPLOY_ASSET_FACTORY to acknowledge the production boundary'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: asset-factory-production-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  ASSET_FACTORY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Build, typecheck, and verify
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Establish authenticated main reference for doctor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              fetch --no-tags origin main:refs/remotes/origin/main
            unset auth
          fi
          git show-ref --verify refs/remotes/origin/main
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            life-map-pipeline/functions/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install engine dependencies
        run: npm --prefix engine install

      - name: Install legacy functions dependencies
        run: npm --prefix functions install

      - name: Install deploy functions dependencies
        run: npm --prefix life-map-pipeline/functions install

      - name: Install Studio dependencies
        run: npm --prefix assetfactory-studio install

      - name: Doctor
        env:
          ASSET_FACTORY_DOCTOR_SKIP_HEAD_MATCH: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: npm run doctor --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Launch readiness
        run: npm run test:launch-readiness --if-present

      - name: Non-blocking dependency audit
        run: npm run audit:all

  provider-boundary:
    name: Production deployment fail-closed
    runs-on: ubuntu-latest
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true
    permissions:
      contents: read
    steps:
      - name: Checkout exact dispatch candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "${{ inputs.deploy }}" = "true"
          test "${{ inputs.confirm }}" = "DEPLOY_ASSET_FACTORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Fail closed until dedicated Asset Factory hosting target is provider-proven
        shell: bash
        run: |
          set -euo pipefail
          echo "Production deployment is blocked: provider-native inventory has not yet proved the dedicated Asset Factory hosting target and current domain attachment." >&2
          echo "The consumer Firebase Hosting site urai-4dc1d is explicitly prohibited as the Asset Factory web target." >&2
          echo "No OIDC token, Firebase credential, hosting mutation, function deployment, DNS mutation, or production data mutation is performed by this workflow." >&2
          exit 1
