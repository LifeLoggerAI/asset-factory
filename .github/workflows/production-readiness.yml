name: Asset Factory Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/asset-forge-triggers/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Run the Firebase production deployment after verification'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'Type DEPLOY_ASSET_FACTORY to authorize deployment'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: asset-factory-production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASSET_FACTORY_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Build, typecheck, and verify
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Establish authenticated main reference for doctor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              fetch --no-tags origin main:refs/remotes/origin/main
            unset auth
          fi
          git show-ref --verify refs/remotes/origin/main
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            life-map-pipeline/functions/package-lock.json

      - name: Install root dependencies
        run: node scripts/install-locked-dependencies.mjs

      - name: Doctor
        env:
          ASSET_FACTORY_DOCTOR_SKIP_HEAD_MATCH: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: npm run doctor --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Launch readiness
        run: npm run test:launch-readiness --if-present

  dependency-security:
    name: Installed dependency security
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frozen workspace dependencies
        run: node scripts/install-locked-dependencies.mjs
      - name: Install frozen deployment Functions dependencies
        run: node scripts/install-locked-dependencies.mjs --deployment-functions
      - name: Test local advisory rejection and installed graph resolution
        run: node --test scripts/test-installed-reviewed-advisories.mjs
      - name: Download pinned public reviewed advisory data without uploading dependency metadata
        run: |
          git init .public-reviewed-advisories
          git -C .public-reviewed-advisories remote add origin https://github.com/github/advisory-database.git
          git -C .public-reviewed-advisories fetch --depth 1 origin 161aa622af11e0b687366ff64cf068f7cca59a50
          git -C .public-reviewed-advisories checkout --detach FETCH_HEAD
      - name: Reject installed high or critical advisories
        run: node scripts/check-installed-reviewed-advisories.mjs .public-reviewed-advisories artifacts/installed-dependency-security.json
      - name: Retain actual installed graph and unresolved security findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-dependency-security-${{ env.ASSET_FACTORY_EXACT_HEAD }}
          path: artifacts/installed-dependency-security.json
          if-no-files-found: warn

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [verify, dependency-security]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy == true &&
      inputs.confirm == 'DEPLOY_ASSET_FACTORY'
    environment: asset-factory-production
    permissions:
      contents: read
      id-token: write
    env:
      ASSET_FACTORY_FIREBASE_PROJECT_ID: ${{ vars.ASSET_FACTORY_FIREBASE_PROJECT_ID }}
      ASSET_FACTORY_FIREBASE_HOSTING_SITE: ${{ vars.ASSET_FACTORY_FIREBASE_HOSTING_SITE }}
      ASSET_FACTORY_BASE_URL: ${{ vars.ASSET_FACTORY_BASE_URL }}
      ASSET_FACTORY_SMOKE_READONLY: 'true'
    steps:
      - name: Require WIF deployment identity
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "GCP_WIF_PROVIDER is required; long-lived Firebase deployment credentials are prohibited." >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "GCP_DEPLOY_SERVICE_ACCOUNT is required; long-lived Firebase deployment credentials are prohibited." >&2; exit 1; }

      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ASSET_FACTORY_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test '${{ inputs.deploy }}' = 'true'
          test '${{ inputs.confirm }}' = 'DEPLOY_ASSET_FACTORY'
          test "$(git rev-parse HEAD)" = "$ASSET_FACTORY_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$ASSET_FACTORY_SMOKE_READONLY" = true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install dependencies
        run: |
          node scripts/install-locked-dependencies.mjs
          node scripts/install-locked-dependencies.mjs --deployment-functions

      - name: Build
        run: npm run build

      - name: Validate dedicated production target
        run: npm run validate:production-target

      - name: Authenticate to Google Cloud with WIF
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.ASSET_FACTORY_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Verify ephemeral deployment credential
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        run: node scripts/run-dedicated-firebase-deploy.mjs --only hosting,functions,firestore,storage

      - name: Remove ephemeral deployment credential
        shell: bash
        env:
          CREDENTIAL_PATH: ${{ steps.google_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          test -n "$CREDENTIAL_PATH"
          case "$CREDENTIAL_PATH" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo "Unexpected ADC credential path; refusing cleanup outside the generated WIF file." >&2; exit 1 ;;
          esac
          rm -f -- "$CREDENTIAL_PATH"
          test ! -e "$CREDENTIAL_PATH"

      - name: Read-only smoke production finalization endpoints
        shell: bash
        run: |
          set -euo pipefail
          test "$ASSET_FACTORY_SMOKE_READONLY" = true
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          test -z "${GOOGLE_GHA_CREDS_PATH:-}"
          npm run smoke:production-finalization
