name: FINITE TIME OpenAI Physics Validation V2

on:
  push:
    branches: [main]
    paths:
      - authorizations/execute-finite-time-openai-physics-validation-v2-20260912.json

permissions:
  contents: read

env:
  AUTHORIZATION_MARKER: authorizations/execute-finite-time-openai-physics-validation-v2-20260912.json

concurrency:
  group: finite-time-openai-physics-validation-v2-20260912
  cancel-in-progress: false

jobs:
  validate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: paid-asset-generation
    steps:
      - name: Checkout exact authorization commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact defect-driven retry authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = "$AUTHORIZATION_MARKER"
          test -z "${OPENAI_API_KEY:-}"
          python - <<'PY'
          import json
          m=json.load(open('authorizations/execute-finite-time-openai-physics-validation-v2-20260912.json'))
          assert m['schemaVersion']=='finite-time-private-production-validation-retry-v1'
          assert m['confirmation']=='AUTHORIZE_FINITE_TIME_OPENAI_PHYSICS_VALIDATION_V2'
          assert m['provider']=='openai'
          assert m['model']=='sora-2'
          assert m['maximumProviderCalls']==1
          assert m['priorRunId']==34672206540
          assert m['priorArtifactId']==10290224314
          assert m['retryReason']=='reject-static-beauty-shot-and-hull-text'
          assert m['automaticRetryAuthorized'] is False
          assert m['promotionAuthorized'] is False
          assert m['deploymentAuthorized'] is False
          assert m['publicReleaseAuthorized'] is False
          assert m['privateReviewAuthorized'] is True
          assert m['independentReviewDeferred'] is True
          PY

      - name: Generate one corrected moving physics validation clip
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          root='artifacts/finite-time/physics-validation-v2'
          mkdir -p "$root"
          prompt='Photoreal cinematic autobiographical-memory reconstruction at an East Texas lake. Start with a low classic white ski boat with restrained blue-teal striping tied beside a wooden dock, then during this single continuous shot the driver puts the boat in gear and the boat clearly pulls away from the dock into open water. The stern settles under power, the mooring line is already released, water displacement increases, a visible physically correct wake forms and expands, reflections deform naturally, and a loose tow rope in the rear shifts and tightens with believable gravity and inertia without touching a skier. The camera makes a restrained handheld lateral follow so the boat changes position substantially across frame; this must read as unmistakable new moving cinema, never a still photograph, slideshow, Ken Burns move, or static beauty shot. Stable boat geometry, real fiberglass, correct windshield and hull proportions, realistic dock posts, natural East Texas morning light, subtle 35mm film response. ABSOLUTELY NO letters, words, names, logos, branding, registration numbers, decals, signage, or text anywhere on boat, dock, water, or image. No warped hull, no melting geometry, no impossible reflections, no floating objects, no excessive slow motion.'
          curl --fail-with-body -sS https://api.openai.com/v1/videos \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -F "model=sora-2" \
            -F "size=1280x720" \
            -F "seconds=8" \
            -F "prompt=$prompt" \
            > "$root/create.json"
          video_id="$(jq -r '.id // empty' "$root/create.json")"
          test -n "$video_id"
          printf '%s' "$video_id" > "$root/video-id.txt"
          status=''
          for i in $(seq 1 90); do
            curl --fail-with-body -sS "https://api.openai.com/v1/videos/$video_id" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              > "$root/status.json"
            status="$(jq -r '.status // empty' "$root/status.json")"
            if [ "$status" = completed ] || [ "$status" = failed ]; then break; fi
            sleep 10
          done
          test "$status" = completed
          curl --fail-with-body -sS "https://api.openai.com/v1/videos/$video_id/content" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -o "$root/ft-fl-028-physics-validation-v2.mp4"
          test -s "$root/ft-fl-028-physics-validation-v2.mp4"
          sha256sum "$root/ft-fl-028-physics-validation-v2.mp4" > "$root/SHA256SUMS.txt"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('artifacts/finite-time/physics-validation-v2')
          create=json.loads((root/'create.json').read_text())
          status=json.loads((root/'status.json').read_text())
          receipt={
            'schemaVersion':'finite-time-openai-physics-validation-receipt-v2',
            'status':'generated-awaiting-literal-qc',
            'provider':'openai',
            'model':status.get('model') or create.get('model'),
            'videoId':status.get('id') or create.get('id'),
            'generatedSeconds':int(status.get('seconds') or create.get('seconds') or 8),
            'size':status.get('size') or create.get('size'),
            'providerCallsExecuted':1,
            'priorRunId':34672206540,
            'priorArtifactId':10290224314,
            'retryReason':'reject-static-beauty-shot-and-hull-text',
            'automaticRetryAuthorized':False,
            'privateProductionOnly':True,
            'publicReleaseAuthorized':False,
            'independentReviewDeferred':True,
            'literalQcRequired':True
          }
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Upload private validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-time-openai-physics-validation-v2-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            artifacts/finite-time/physics-validation-v2/**
            authorizations/execute-finite-time-openai-physics-validation-v2-20260912.json
