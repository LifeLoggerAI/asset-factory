name: V1 Alpha Score Recovery Proof

on:
  push:
    branches: [fix/v1-alpha-aware-recovery-20260729]
    paths:
      - image_asset_generator/score_v1_assets.py
      - image_asset_generator/test_score_v1_alpha_metrics.py
      - .github/workflows/v1-alpha-score-recovery-proof.yml
  pull_request:
    paths:
      - image_asset_generator/score_v1_assets.py
      - image_asset_generator/test_score_v1_alpha_metrics.py
      - .github/workflows/v1-alpha-score-recovery-proof.yml

permissions:
  actions: read
  contents: read

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install Pillow pytest
      - name: Run alpha metric regressions
        working-directory: image_asset_generator
        run: pytest -q test_score_v1_alpha_metrics.py
      - name: Download retained paid V1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8741010314/zip > "$RUNNER_TEMP/v1-paid.zip"
          mkdir -p "$RUNNER_TEMP/v1-paid"
          unzip -q "$RUNNER_TEMP/v1-paid.zip" -d "$RUNNER_TEMP/v1-paid"
      - name: Re-score immutable pack without provider access
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1-paid/image_asset_generator"
          cp image_asset_generator/score_v1_assets.py "$root/score_v1_assets.py"
          cp "$root/manifests/generated/v1.manifest.json" "$root/manifest.json"
          cd "$root"
          set +e
          ASSET_QUALITY_REQUIRE_PROVIDER=1 python score_v1_assets.py
          code=$?
          set -e
          test "$code" = '4'
          python - <<'PY'
          import json
          report=json.load(open('quality_report.json'))
          failed=[item['name'] for item in report['assets'] if item['status'] != 'passed']
          assert report['passed'] == 52, report
          assert report['failed'] == 1, report
          assert failed == ['avatar_receptionist'], failed
          print('PROVEN passed=52 failed=1 retry=avatar_receptionist')
          PY
      - name: Upload no-spend recovery proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-alpha-score-recovery-${{ github.sha }}
          retention-days: 365
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/v1-paid/image_asset_generator/quality_report.json
            ${{ runner.temp }}/v1-paid/image_asset_generator/upgrade_feedback.json
