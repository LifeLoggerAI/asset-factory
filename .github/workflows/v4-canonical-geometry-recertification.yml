name: V4 Canonical Geometry Recertification

on:
  pull_request:
    paths:
      - image_asset_generator/score_v1_assets.py
      - scripts/recertify_v4_canonical_geometry.py
      - tests/test_score_canonical_dimensions.py
      - .github/workflows/v4-canonical-geometry-recertification.yml
  push:
    branches: [main]
    paths:
      - image_asset_generator/score_v1_assets.py
      - scripts/recertify_v4_canonical_geometry.py
      - tests/test_score_canonical_dimensions.py
      - .github/workflows/v4-canonical-geometry-recertification.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: v4-canonical-geometry-recertification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_ARTIFACT_ID: '8763242401'
      SOURCE_ARTIFACT_DIGEST: sha256:b99e5e7d653cbf4a02d41504387cc59ee1c3a8f7dea45f5825d75664e910daa9
      OUTPUT_ROOT: artifacts/exact-paid/v4-canonical-recertification
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned generator dependencies
        run: python -m pip install -r image_asset_generator/requirements.txt pytest

      - name: Run canonical geometry regression coverage
        run: pytest -q tests/test_score_canonical_dimensions.py

      - name: Download and prove immutable original V4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$RUNNER_TEMP/v4-artifact.json"
          python - "$RUNNER_TEMP/v4-artifact.json" <<'PY'
          import json,os,sys
          payload=json.load(open(sys.argv[1]))
          assert payload['id']==int(os.environ['SOURCE_ARTIFACT_ID']),payload
          assert payload['name']=='urai-v4-exact-paid-30543824770',payload
          assert payload['expired'] is False,payload
          assert payload.get('digest')==os.environ['SOURCE_ARTIFACT_DIGEST'],payload
          assert payload.get('workflow_run',{}).get('id')==30543824770,payload
          assert payload.get('workflow_run',{}).get('head_sha')=='c388b1ce3d6fc27ef30599eb6535605bff202fb7',payload
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/v4-original.zip"
          mkdir -p "$RUNNER_TEMP/v4-original"
          unzip -q "$RUNNER_TEMP/v4-original.zip" -d "$RUNNER_TEMP/v4-original"

      - name: Compile zero-spend recertifier
        run: python -m py_compile scripts/recertify_v4_canonical_geometry.py image_asset_generator/score_v1_assets.py

      - name: Recertify all 39 retained V4 outputs with zero provider calls
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"
          python scripts/recertify_v4_canonical_geometry.py \
            --retained-root "$RUNNER_TEMP/v4-original" \
            --output-root "$OUTPUT_ROOT"

      - name: Prove terminal V4 receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$OUTPUT_ROOT/v4-generation-receipt.json" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1]))
          assert payload['status']=='passed',payload
          assert payload['generated']==39 and payload['passed']==39 and payload['failed']==0,payload
          assert payload['failedNames']==[],payload
          assert payload['providerCallsExecutedThisRecertification']==0,payload
          assert payload['reservedEstimatedCostUsdThisRecertification']=='0.00',payload
          assert payload['providerCallsExecuted']==44,payload
          assert payload['reservedEstimatedCostUsd']=='44.00',payload
          assert payload['exactDuplicateGroups']==[],payload
          assert payload['promotionAuthorized'] is False,payload
          assert payload['deploymentAuthorized'] is False,payload
          assert len(payload['assets'])==39,payload
          print(json.dumps({key:payload[key] for key in ('status','generated','passed','failed','providerCallsExecutedThisRecertification','reservedEstimatedCostUsdThisRecertification','receiptSha256')},sort_keys=True))
          PY

      - name: Upload immutable V4 recertification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-v4-canonical-recertification-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: |
            artifacts/exact-paid/v4-canonical-recertification/**
            image_asset_generator/manifests/generated/v4-canonical.manifest.json
