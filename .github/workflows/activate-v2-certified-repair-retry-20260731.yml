name: V2 Certified Repair Compatibility Retry Receipt

on:
  push:
    branches: [repair/v2-certified-gaps-20260730]
    paths:
      - authorizations/activate-v2-certified-repair-retry-20260731.json
      - authorizations/execute-v2-certified-repair-20260730.json
      - manifests/v2-certified-repair-manifest-20260730.json.gz.b64
      - scripts/generate_v2_certified_replacements_retry.py
      - .github/workflows/activate-v2-certified-repair-retry-20260731.yml
  pull_request:
    branches: [main]
    paths:
      - authorizations/activate-v2-certified-repair-retry-20260731.json
      - authorizations/execute-v2-certified-repair-20260730.json
      - manifests/v2-certified-repair-manifest-20260730.json.gz.b64
      - scripts/generate_v2_certified_replacements_retry.py
      - .github/workflows/activate-v2-certified-repair-retry-20260731.yml

permissions:
  contents: read

concurrency:
  group: v2-certified-repair-compatibility-retry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore exact certified repair manifest
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('manifests/v2-certified-repair-manifest-20260730.json.gz.b64').read_text().strip()
          Path('manifests/v2-certified-repair-manifest-20260730.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Validate bounded compatibility retry without provider access
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path('authorizations/execute-v2-certified-repair-20260730.json')
          retry_path = Path('authorizations/activate-v2-certified-repair-retry-20260731.json')
          manifest_path = Path('manifests/v2-certified-repair-manifest-20260730.json')
          generator_path = Path('scripts/generate_v2_certified_replacements_retry.py')

          authority = json.loads(authority_path.read_text())
          retry = json.loads(retry_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          execution = authority['execution']

          expected_policy = {
              'opaque': 'gpt-image-2',
              'alphaRequired': 'gpt-image-1',
              'reason': 'OpenAI rejected gpt-image-2 background=transparent before image generation in run 30629189918 job 91151803605',
          }
          assert authority['programAuthority'] == 'LifeLoggerAI/asset-factory#206'
          assert execution['modelPolicy'] == expected_policy
          assert execution['priorRejectedProviderRequests'] == 1
          assert execution['maxAdditionalProviderCalls'] == 141
          assert execution['maxAggregateProviderCalls'] == 142
          assert execution['maxSpendUsd'] == '20.00'
          assert execution['promotionAuthorized'] is False
          assert execution['deploymentAuthorized'] is False

          assert retry['programAuthority'] == authority['programAuthority']
          assert retry['executionNonce'] == 'v2-71-certified-repair-20260731-r2'
          assert retry['requested'] is True
          assert retry['supersedesFailedRun'] == 30629189918
          assert retry['priorRejectedProviderRequests'] == 1
          assert retry['modelPolicy'] == {
              'opaque': 'gpt-image-2',
              'alphaRequired': 'gpt-image-1',
          }
          assert retry['replacementAssets'] == 71
          assert retry['preservedAssets'] == 9
          assert retry['maxAdditionalProviderCalls'] == 141
          assert retry['maxAggregateProviderCalls'] == 142
          assert retry['maxSpendUsd'] == '20.00'
          assert retry['promotionAuthorized'] is False
          assert retry['deploymentAuthorized'] is False

          assert len(manifest['replacements']) == 71
          assert len(manifest['preserve']) == 9

          output = Path('artifacts/v2-certified-repair-compatibility-retry')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'receipt.json').write_text(json.dumps({
              'status': 'validated-no-spend',
              'programAuthority': authority['programAuthority'],
              'executionNonce': retry['executionNonce'],
              'supersedesFailedRun': retry['supersedesFailedRun'],
              'priorRejectedProviderRequests': 1,
              'replacementAssets': 71,
              'preservedAssets': 9,
              'maxAdditionalProviderCalls': 141,
              'maxAggregateProviderCalls': 142,
              'maxSpendUsd': '20.00',
              'providerCallsThisValidation': 0,
              'spendUsdThisValidation': '0.00',
              'promotionAuthorized': False,
              'deploymentAuthorized': False,
              'protectedExecutionWorkflow': '.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml',
              'authoritySha256': hashlib.sha256(authority_path.read_bytes()).hexdigest(),
              'retrySha256': hashlib.sha256(retry_path.read_bytes()).hexdigest(),
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'generatorSha256': hashlib.sha256(generator_path.read_bytes()).hexdigest(),
          }, indent=2, sort_keys=True) + '\n')
          print('V2_COMPATIBILITY_RETRY_VALID_NO_SPEND')
          PY
          python -m py_compile scripts/generate_v2_certified_replacements_retry.py
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"
      - name: Upload no-spend compatibility retry receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-certified-repair-compatibility-retry-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/v2-certified-repair-compatibility-retry/receipt.json
