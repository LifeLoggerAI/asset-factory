name: V1 Safe Resume Control Validation

on:
  pull_request:
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/v1-safe-resume-control-validation.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - image_asset_generator/recover_v1_receptionist.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/v1-safe-resume-control-validation.yml
      - authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json
      - image_asset_generator/recover_v1_receptionist.py
      - scripts/validate_v1_receptionist_recovery_marker.py
      - scripts/validate_v1_receptionist_recovery_commit.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove exact source and retired authorization state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git fetch --no-tags --depth=1 origin "$base"
            git diff --name-status --no-renames "$base" HEAD -- authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json | grep -Fx 'D	authorizations/execute-v1-aaa-spatial-pack-safe-resume-3-20260711.json'
          fi
      - name: Compile recovery controls
        run: |
          python3 -m py_compile \
            scripts/validate_v1_receptionist_recovery_marker.py \
            scripts/validate_v1_receptionist_recovery_commit.py \
            image_asset_generator/recover_v1_receptionist.py
      - name: Verify fresh marker must be one added file on protected main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          commit=Path('scripts/validate_v1_receptionist_recovery_commit.py').read_text()
          workflow=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          assert "expected = [f'A\\t{marker_path.as_posix()}']" in commit
          assert "'--no-renames'" in commit
          assert 'validate_marker(marker_path, parent_sha)' in commit
          assert 'branches: [main]' in workflow
          assert 'workflow_dispatch' not in workflow
          assert 'repository_dispatch' not in workflow
          assert 'github.actor == github.repository_owner && github.run_attempt == 1' in workflow
          assert 'test "$GITHUB_REF" = refs/heads/main' in workflow
          PY
      - name: Verify no-duplicate retained recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          executor=Path('image_asset_generator/recover_v1_receptionist.py').read_text()
          for value in ('8741010314','accepted=52','avatar_receptionist',"ASSET_FORGE_MAX_PROVIDER_CALLS: '1'","ASSET_FORGE_MAX_COST_USD: '1.00'"):
              assert value in workflow, value
          for value in ('snapshot_accepted','assert_accepted_unchanged',"generation.get('outputRequests') != 1","ledger.get('providerCallsExecuted') != 1"):
              assert value in executor, value
          assert "ASSET_FORGE_SKIP_EXISTING_OUTPUTS'] = '0'" in executor
          PY
      - name: Verify sole paid workflow and no deployment authority
        run: |
          python3 scripts/check-paid-workflow-boundary.py
          python3 scripts/test-paid-workflow-boundary.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml').read_text()
          for forbidden in ('contents: write','deployments: write','id-token: write','firebase deploy','git push','merge_pull_request'):
              assert forbidden not in text, forbidden
          PY
