name: Asset Factory One-Shot Lock Refresh

on:
  push:
    branches:
      - hardening/asset-factory-production-authority-20260924
    paths:
      - '.github/workflows/asset-factory-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/asset-factory-production-authority-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Regenerate workspace lock from current manifests
        run: pnpm install --lockfile-only
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lock): refresh Asset Factory workspace lock"
          git push origin HEAD:hardening/asset-factory-production-authority-20260924
