name: Publish V1 Paid Run Status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1-paid-run-status.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-v1-paid-run-status
  cancel-in-progress: false

env:
  TARGET_WORKFLOW: one-time-v1-aaa-spatial-pack-safe-resume-3.yml
  TARGET_HEAD_SHA: edfdf99fa3269e3d056416383e1befc1f97f7a01
  TARGET_ISSUE: '204'

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Inspect push-triggered paid workflow and publish terminal status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/v1-paid-run.json"
          : > "$run_json"

          for attempt in $(seq 1 180); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100" > "$RUNNER_TEMP/v1-paid-runs.json"
            jq -c --arg sha "$TARGET_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' "$RUNNER_TEMP/v1-paid-runs.json" > "$run_json"
            if [[ -s "$run_json" ]]; then
              status="$(jq -r '.status' "$run_json")"
              if [[ "$status" == completed ]]; then
                break
              fi
            fi
            sleep 30
          done

          if [[ ! -s "$run_json" ]]; then
            cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## V1 receptionist recovery status — no matching run found

          - Expected workflow: \`${TARGET_WORKFLOW}\`
          - Expected immutable authorization SHA: \`${TARGET_HEAD_SHA}\`
          - Matching push-triggered run: **none found after polling**
          - Provider call, spend, generation, promotion, deployment, or secret read by this publisher: **none**

          Do not create another paid marker or infer execution success from this receipt.
          EOF
          else
            run_id="$(jq -r '.id' "$run_json")"
            run_number="$(jq -r '.run_number' "$run_json")"
            run_attempt="$(jq -r '.run_attempt' "$run_json")"
            event="$(jq -r '.event' "$run_json")"
            status="$(jq -r '.status' "$run_json")"
            conclusion="$(jq -r '.conclusion // "pending"' "$run_json")"
            created_at="$(jq -r '.created_at' "$run_json")"
            updated_at="$(jq -r '.updated_at' "$run_json")"
            html_url="$(jq -r '.html_url' "$run_json")"

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$RUNNER_TEMP/v1-paid-jobs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$RUNNER_TEMP/v1-paid-artifacts.json"
            jq -r '.jobs[] | "- `\(.id)` **\(.name)** — `\(.status)` / `\(.conclusion // "pending")`"' "$RUNNER_TEMP/v1-paid-jobs.json" > "$RUNNER_TEMP/jobs.md"
            jq -r '.artifacts[] | "- `\(.id)` **\(.name)** — expired `\(.expired)`, bytes `\(.size_in_bytes)`, digest `\(.digest // "unavailable")`"' "$RUNNER_TEMP/v1-paid-artifacts.json" > "$RUNNER_TEMP/artifacts.md"
            [[ -s "$RUNNER_TEMP/jobs.md" ]] || printf '%s\n' '- No jobs reported.' > "$RUNNER_TEMP/jobs.md"
            [[ -s "$RUNNER_TEMP/artifacts.md" ]] || printf '%s\n' '- No retained artifacts reported.' > "$RUNNER_TEMP/artifacts.md"

            cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## V1 receptionist recovery terminal status

          - Workflow: \`${TARGET_WORKFLOW}\`
          - Immutable authorization SHA: \`${TARGET_HEAD_SHA}\`
          - Run: [\`${run_id}\`](${html_url}) — number \`${run_number}\`, attempt \`${run_attempt}\`
          - Event: \`${event}\`
          - Status: **${status}**
          - Conclusion: **${conclusion}**
          - Created: \`${created_at}\`
          - Updated: \`${updated_at}\`

          ### Jobs
          $(cat "$RUNNER_TEMP/jobs.md")

          ### Artifacts
          $(cat "$RUNNER_TEMP/artifacts.md")

          This publisher is read-only against Actions metadata. It does not receive \`OPENAI_API_KEY\`, call a provider, spend money, generate assets, promote assets, deploy, or mutate production data.
          EOF
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_ISSUE}/comments" -f body="$(cat "$RUNNER_TEMP/comment.md")"
