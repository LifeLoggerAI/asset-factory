name: One-Time Before the Rest of the World Proof

on:
  push:
    branches: [main]
    paths:
      - authorizations/execute-before-rest-world-proof-20260731.json

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-before-rest-world-proof-20260731
  cancel-in-progress: false

jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: paid-asset-generation
    env:
      AUTHORIZATION_MARKER: authorizations/execute-before-rest-world-proof-20260731.json
      MANIFEST_PATH: manifests/film/before-rest-world-proof.manifest.json
      OUTPUT_ROOT: artifacts/film/before-rest-world-proof
      ASSET_RENDERER_PROVIDER: openai
      ASSET_RENDERER_ENDPOINT: https://api.openai.com/v1/images/generations
      ASSET_RENDERER_MODEL: gpt-image-2
      ASSET_RENDERER_MODE: provider
      ASSET_RENDERER_MAX_ATTEMPTS: '1'
      ASSET_FORGE_PAID_RUN_AUTHORIZED: '1'
      ASSET_FORGE_MAX_PROVIDER_CALLS: '10'
      ASSET_FORGE_MAX_UNIT_COST_USD: '1.00'
      ASSET_FORGE_MAX_COST_USD: '10.00'
      ASSET_FORGE_RUN_ID: ${{ github.run_id }}-before-rest-world-proof
      ASSET_FORGE_BUDGET_STATE_PATH: ${{ github.workspace }}/artifacts/film/before-rest-world-proof/budget-state.json
    steps:
      - name: Checkout exact authorization commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact one-marker trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = "$AUTHORIZATION_MARKER"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          test -z "${ASSET_RENDERER_AUTH_HEADER:-}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned generator dependencies
        run: python -m pip install -r image_asset_generator/requirements.txt

      - name: Compile bounded film generator
        run: python -m py_compile scripts/generate_before_rest_world_proof.py

      - name: Generate exact ten-shot proof tranche
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python scripts/generate_before_rest_world_proof.py \
            --manifest "$MANIFEST_PATH" \
            --authorization "$AUTHORIZATION_MARKER" \
            --output-root "$OUTPUT_ROOT"

      - name: Prove bounded result and closed authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/film/before-rest-world-proof')
          receipt = json.loads((root / 'before-rest-world-generation-receipt.json').read_text())
          assert receipt['status'] == 'passed', receipt
          assert receipt['expected'] == 10, receipt
          assert receipt['generated'] == 10, receipt
          assert receipt['failed'] == 0, receipt
          assert receipt['providerCallsExecuted'] == 10, receipt
          assert receipt['reservedEstimatedCostUsd'] == '10.00', receipt
          assert receipt['maximumAuthorizedCostUsd'] == '10.00', receipt
          assert receipt['promotionAuthorized'] is False, receipt
          assert receipt['deploymentAuthorized'] is False, receipt
          assert receipt['publicReleaseAuthorized'] is False, receipt
          assert len(receipt['assets']) == 10, receipt
          assert (root / 'before-rest-world-contact-sheet.jpg').is_file()
          assert len(list((root / 'sources').glob('*.png'))) == 10
          assert len(list((root / 'previews').glob('*.webp'))) == 10
          print(json.dumps({key: receipt[key] for key in ('status','generated','providerCallsExecuted','reservedEstimatedCostUsd')}, sort_keys=True))
          PY

      - name: Upload immutable proof-of-look evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: before-rest-world-proof-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            artifacts/film/before-rest-world-proof/**
            manifests/film/before-rest-world-proof.manifest.json
            authorizations/execute-before-rest-world-proof-20260731.json
