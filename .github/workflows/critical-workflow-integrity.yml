name: Critical Workflow Integrity

on:
  pull_request:
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/one-time-before-rest-world-cinematic-motion.yml
      - .github/workflows/one-time-before-rest-world-full-master-t1.yml
      - authorizations/execute-before-rest-world-cinematic-motion-20260801.json
      - authorizations/execute-before-rest-world-full-master-t1-20260801.json
      - .github/workflows/canonical-version-forge.yml
      - .github/workflows/v1-checkpoint-finalize.yml
      - .github/workflows/v1-promote-finalized-checkpoint.yml
      - .github/workflows/critical-workflow-integrity.yml
      - scripts/check-critical-workflow-pins.py
      - scripts/check-paid-workflow-boundary.py
      - scripts/check-paid-workflow-boundary-current.py
      - scripts/test-paid-workflow-boundary.py
      - scripts/test-paid-workflow-current-authorities.py
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-v1-aaa-spatial-pack-safe-resume-3.yml
      - .github/workflows/one-time-before-rest-world-cinematic-motion.yml
      - .github/workflows/one-time-before-rest-world-full-master-t1.yml
      - authorizations/execute-before-rest-world-cinematic-motion-20260801.json
      - authorizations/execute-before-rest-world-full-master-t1-20260801.json
      - .github/workflows/canonical-version-forge.yml
      - .github/workflows/v1-checkpoint-finalize.yml
      - .github/workflows/v1-promote-finalized-checkpoint.yml
      - .github/workflows/critical-workflow-integrity.yml
      - scripts/check-critical-workflow-pins.py
      - scripts/check-paid-workflow-boundary.py
      - scripts/check-paid-workflow-boundary-current.py
      - scripts/test-paid-workflow-boundary.py
      - scripts/test-paid-workflow-current-authorities.py
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-workflow-integrity-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify-critical-workflows:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify pinned paid workflow authorities
        run: |
          python3 scripts/check-critical-workflow-pins.py
          npm run check:paid-workflow-boundary

      - name: Final clean-tree proof
        run: test -z "$(git status --porcelain --untracked-files=all)"
