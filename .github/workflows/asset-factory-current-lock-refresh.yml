name: Asset Factory Current-Head Lock Refresh

on:
  push:
    branches:
      - hardening/asset-factory-production-authority-20260924
    paths:
      - '.github/workflows/asset-factory-current-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/asset-factory-production-authority-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Rebase onto live branch and regenerate locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hardening/asset-factory-production-authority-20260924
          git rebase origin/hardening/asset-factory-production-authority-20260924
          pnpm install --lockfile-only
          npm --prefix engine install --package-lock-only --ignore-scripts
          git add pnpm-lock.yaml engine/npm-shrinkwrap.json
          if git diff --cached --quiet; then
            echo "Locks already current"
            exit 0
          fi
          git commit -m "chore(lock): regenerate Asset Factory security locks"
          git push origin HEAD:hardening/asset-factory-production-authority-20260924
