<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>URAI Internal Service</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b12;
        color: #edf4ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(92, 141, 255, 0.18), transparent 34rem), #080b12;
      }
      main {
        width: min(680px, calc(100% - 40px));
        padding: 48px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 24px;
        background: rgba(255,255,255,.06);
        box-shadow: 0 24px 80px rgba(0,0,0,.28);
      }
      .eyebrow {
        color: #a8c7ff;
        letter-spacing: .16em;
        text-transform: uppercase;
        font-size: 13px;
        font-weight: 700;
      }
      h1 { margin: 16px 0; font-size: clamp(32px, 7vw, 56px); line-height: 1; }
      p { margin: 0; color: #c8d7ef; font-size: 18px; line-height: 1.65; }
      a { display: inline-block; margin-top: 28px; color: #d7e5ff; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #a8c7ff; outline-offset: 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">URAI internal infrastructure</div>
      <h1>Restricted service.</h1>
      <p>
        This system supports URAI operations and is not a public product or marketing site.
        Public access is not provided here.
      </p>
      <a href="https://urai.app/">Return to UrAi</a>
    </main>
  </body>
</html>
